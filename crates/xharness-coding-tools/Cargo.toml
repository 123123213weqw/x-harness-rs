[package]
name = "xharness-coding-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Model-facing coding, background-job and Web tools for XHarness"

[features]
default = ["rustls-tls"]
rustls-tls = ["xharness-web/rustls-tls"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
xharness-fs = { path = "../xharness-fs" }
xharness-jobs = { path = "../xharness-jobs" }
xharness-platform = { path = "../xharness-platform" }
xharness-process = { path = "../xharness-process" }
xharness-tools = { path = "../xharness-tools" }
xharness-web = { path = "../xharness-web", default-features = false }

xharness-debug = { path = "../xharness-debug" }

[dev-dependencies]
async-trait.workspace = true
futures.workspace = true
xharness-core = { path = "../xharness-core" }
xharness-sandbox = { path = "../xharness-sandbox" }
xharness-provider-openai = { path = "../xharness-provider-openai" }
