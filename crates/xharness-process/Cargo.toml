[package]
name = "xharness-process"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/123123213weqw/x-harness-rs"
description = "Native managed process runtime for XHarness tools"

[dependencies]
serde_json.workspace = true
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
xharness-debug = { path = "../xharness-debug" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
xharness-win32 = { path = "../xharness-win32" }
