[package]
name = "xharness-fs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/123123213weqw/x-harness-rs"
description = "Workspace-confined observed-write filesystem service for XHarness"

[dependencies]
sha2.workspace = true
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
xharness-win32 = { path = "../xharness-win32" }
