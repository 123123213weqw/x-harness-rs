[package]
name = "xharness-host-app"
default-run = "xharness-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Linux, macOS and Windows composition and Web executable for XHarness"

[[bin]]
name = "xharness-host"
path = "src/main.rs"

[[bin]]
name = "xharness-browser-extension-host"
path = "src/browser_extension_host.rs"

[dependencies]
axum.workspace = true
base64 = "0.22"
getrandom = "0.3"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
xharness-channel-telegram = { path = "../xharness-channel-telegram" }
xharness-mobile = { path = "../xharness-mobile" }
# Independent reasoning and modality metadata; pinned to the tested source commit.
reasonmap = { git = "https://github.com/123123213weqw/reasonmap", rev = "44159024c3c7a16d175d2cb3a5d665c39fe47d63", version = "=0.4.0" }
fs2 = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png"] }
xharness-attachments = { path = "../xharness-attachments" }
xharness-cloud = { path = "../xharness-cloud" }
xharness-cloud-app = { path = "../xharness-cloud-app" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
sha2.workspace = true
xharness-api = { path = "../xharness-api" }
xharness-coding-tools = { path = "../xharness-coding-tools" }
xharness-compaction = { path = "../xharness-compaction" }
xharness-computer = { path = "../xharness-computer" }
xharness-core = { path = "../xharness-core" }
xharness-control = { path = "../xharness-control" }
xharness-debug = { path = "../xharness-debug" }
xharness-diagnostics = { path = "../xharness-diagnostics" }
xharness-fs = { path = "../xharness-fs" }
xharness-host = { path = "../xharness-host" }
xharness-interaction = { path = "../xharness-interaction" }
xharness-jobs = { path = "../xharness-jobs" }
xharness-agent = { path = "../xharness-agent" }
xharness-process = { path = "../xharness-process" }
xharness-sandbox = { path = "../xharness-sandbox" }
xharness-platform = { path = "../xharness-platform" }
xharness-plugins = { path = "../xharness-plugins" }
xharness-mcp = { path = "../xharness-mcp" }
xharness-provider-openai = { path = "../xharness-provider-openai" }
xharness-schedule = { path = "../xharness-schedule" }
xharness-session = { path = "../xharness-session" }
xharness-session-jsonl = { path = "../xharness-session-jsonl" }
xharness-server = { path = "../xharness-server" }
xharness-remote = { path = "../xharness-remote" }
xharness-terminal = { path = "../xharness-terminal" }
xharness-web-terminal = { path = "../xharness-web-terminal" }
xharness-token = { path = "../xharness-token" }
xharness-web = { path = "../xharness-web" }
xharness-tools = { path = "../xharness-tools" }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tower.workspace = true
xharness-prompt = { path = "../xharness-prompt" }
thiserror.workspace = true
zip = { version = "2.4", default-features = false, features = ["deflate"] }
futures.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["process", "test-util"] }
tokio-tungstenite.workspace = true

[target.'cfg(windows)'.dependencies]
xharness-computer-windows = { path = "../xharness-computer-windows" }
xharness-win32 = { path = "../xharness-win32" }
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
xharness-computer-macos = { path = "../xharness-computer-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
