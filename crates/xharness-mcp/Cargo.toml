[package]
name = "xharness-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded, supervised stdio MCP client for XHarness"

[dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-child-process"] }
process-wrap = { version = "=10.0.1", features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }

[[bin]]
name = "xharness-mcp-fixture"
path = "src/bin/fixture.rs"
