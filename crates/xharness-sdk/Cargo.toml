[package]
name = "xharness-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded Rust SDK for the existing XHarness durable runtime"
readme = "README.md"

[dependencies]
thiserror.workspace = true
xharness-agent = { path = "../xharness-agent" }
xharness-compaction = { path = "../xharness-compaction" }
xharness-core = { path = "../xharness-core" }
xharness-host = { path = "../xharness-host" }
xharness-prompt = { path = "../xharness-prompt" }
xharness-session = { path = "../xharness-session" }
xharness-session-jsonl = { path = "../xharness-session-jsonl" }
xharness-tools = { path = "../xharness-tools" }
tokio-util.workspace = true

[dev-dependencies]
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
