[package]
name = "xharness-installation"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Opt-in, payload-free installation reporting protocol and durable outbox"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
