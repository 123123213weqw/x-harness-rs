[workspace]
members = [
    "crates/xharness-agent",
    "crates/xharness-api",
    "crates/xharness-context",
    "crates/xharness-core",
    "crates/xharness-fs",
    "crates/xharness-host",
    "crates/xharness-host-app",
    "crates/xharness-provider-openai",
    "crates/xharness-process",
    "crates/xharness-platform",
    "crates/xharness-sandbox",
    "crates/xharness-session",
    "crates/xharness-session-jsonl",
    "crates/xharness-server",
    "crates/xharness-terminal",
    "crates/xharness-tools",
    "crates/xharness-web",
    "crates/xharness-coding-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/123123213weqw/x-harness-rs"

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.29"
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
