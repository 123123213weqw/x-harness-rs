name: Updater Secret Transfer (one-shot)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: updater-secret-transfer
  cancel-in-progress: false
jobs:
  seal:
    if: github.repository == '123123213weqw/x-harness-rs' && github.actor == '123123213weqw' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sealed-box runtime (binary wheels only)
        run: python -m pip install --disable-pip-version-check --only-binary=:all: PyNaCl==1.6.2
      - name: Encrypt the existing updater secrets to the owner-selected recipient
        env:
          SIGNING_PRIVATE: ${{ secrets.XHARNESS_FRIENDS_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.XHARNESS_FRIENDS_PASSWORD }}
          SIGNING_PUBLIC: ${{ secrets.XHARNESS_FRIENDS_PUBLIC_KEY }}
        run: |
          python - <<'PYTHON'
          import os, json, base64, hashlib
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          request = {'request_id': '122da0b0-d2aa-4156-96b5-f23fced570f7', 'recipient_public_key': 'gfK7Rs3khJ7VfZPJ9n2rx5WpgA4twjIP+MFOTB8Ks0Y=', 'source_repository': '123123213weqw/x-harness-rs', 'target_repository': '123123213weqw/xharness-product'}
          recipient = base64.b64decode(request['recipient_public_key'], validate=True)
          assert len(recipient) == 32
          assert os.environ.get('GITHUB_REPOSITORY') == request['source_repository']
          pub = os.environ['SIGNING_PUBLIC'].strip()
          packet = base64.b64decode(base64.b64decode(pub, validate=True).decode().strip().splitlines()[1], validate=True)
          assert len(packet) == 42 and packet[:2] == b'Ed'
          assert hashlib.sha256(packet).hexdigest() == '3ec1f86a3e8aa53e94ad3708b6b40222a08e69ac1c80ee1eaa5c24cbb4ffd83a'
          values = {'XHARNESS_FRIENDS_PRIVATE_KEY': os.environ['SIGNING_PRIVATE'], 'XHARNESS_FRIENDS_PASSWORD': os.environ['SIGNING_PASSWORD'], 'XHARNESS_FRIENDS_PUBLIC_KEY': pub}
          assert values['XHARNESS_FRIENDS_PRIVATE_KEY']
          box = SealedBox(PublicKey(recipient))
          envelope = {'schema_version': 1, **request, 'source_sha': os.environ['GITHUB_SHA'], 'source_run_id': os.environ['GITHUB_RUN_ID'], 'secrets': {}}
          for name, value in values.items():
              body = json.dumps({'request_id': request['request_id'], 'target_repository': request['target_repository'], 'name': name, 'value': value}).encode()
              envelope['secrets'][name] = base64.b64encode(box.encrypt(body)).decode()
          Path('sealed').mkdir()
          Path('sealed/transfer.json').write_text(json.dumps(envelope))
          print('Sealed envelope prepared; no plaintext key files or secret log output.')
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: sealed-updater-transfer
          path: sealed/transfer.json
          if-no-files-found: error
          retention-days: 1
