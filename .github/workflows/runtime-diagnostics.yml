name: Runtime diagnostics acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/xharness-diagnostics/**'
      - 'crates/xharness-debug/**'
      - 'crates/xharness-win32/**'
      - 'crates/xharness-host/src/restore.rs'
      - 'apps/desktop/**'
      - 'scripts/*diagnostics*'
      - '.github/workflows/runtime-diagnostics.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p xharness-diagnostics -p xharness-debug -p xharness-win32
      - run: cargo clippy --locked -p xharness-diagnostics -p xharness-debug -p xharness-win32 --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-runtime-diagnostics.mjs
      - name: Validate real native EXE/PDB identity parser
        if: runner.os == 'Windows'
        env:
          XHARNESS_TEST_NATIVE_SYMBOLS: '1'
        run: python -B scripts/test-desktop-symbols.py
      - name: Build Windows Host for offline crash reproduction
        if: runner.os == 'Windows'
        run: cargo build --locked --release -p xharness-host-app -p xharness-sandbox --bins
      - name: Retain matching Host binary and symbols for local dump analysis
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-windows-host-symbols
          path: |
            target/release/xharness-host.exe
            target/release/xharness_host.pdb
          if-no-files-found: error
          retention-days: 30
      - name: Exercise the reasoning projection crash path with synthetic data
        run: cargo test --locked --release -p xharness-host offline_reasoning_projection_stress -- --ignored --nocapture
      - name: Package the offline test executable for same-machine reproduction
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = @(& cargo test --locked --release -p xharness-host --lib --no-run --message-format=json | ForEach-Object { $_ | ConvertFrom-Json })
          if ($LASTEXITCODE) { throw 'Offline test build failed' }
          $tests = @($artifacts | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.target.name -eq 'xharness_host' -and $_.executable })
          if ($tests.Count -ne 1) { throw 'Expected exactly one offline test executable' }
          $out = 'dist/offline-projection-test'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath $tests[0].executable -Destination "$out/offline-projection-tests.exe"
          $pdb = [IO.Path]::ChangeExtension($tests[0].executable, '.pdb')
          if (Test-Path -LiteralPath $pdb) { Copy-Item -LiteralPath $pdb -Destination $out }
          $sha = (Get-FileHash -LiteralPath "$out/offline-projection-tests.exe").Hash
          @{ source = '${{ github.sha }}'; sha256 = $sha; filter = 'offline_reasoning_projection_stress' } | ConvertTo-Json | Set-Content "$out/manifest.json"
      - name: Retain offline projection test
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-offline-projection-test
          path: dist/offline-projection-test/
          if-no-files-found: error
          retention-days: 30
