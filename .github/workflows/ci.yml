name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  context-layout:
    name: Context and Harness layout / Chromium + WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install isolated UI test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-tests" --no-save --package-lock=false playwright@1.61.1 react@18.3.1 react-dom@18.3.1
          node "$RUNNER_TEMP/ui-tests/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - run: node scripts/test-context-plugin.mjs
      - name: Real browser layout regression
        env:
          UI_TEST_DEPS: ${{ runner.temp }}/ui-tests
        run: |
          UI_TEST_BROWSER=chromium node scripts/test-context-layout.mjs
          UI_TEST_BROWSER=webkit node scripts/test-context-layout.mjs

  rust-linux:
    name: Rust / Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test optional Windows release contract without secrets
        run: python3 -B scripts/test-friends-release.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: cargo fmt --check --all
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-windows:
    name: Rust / Windows x86_64
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: cargo fmt --check --all
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build native host and sandbox runner
        run: cargo build --locked --release -p xharness-host-app -p xharness-sandbox --bins
      - name: Install pinned ripgrep for the portable package
        run: |
          $version = '15.2.0'
          $archive = Join-Path $env:RUNNER_TEMP "ripgrep-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ripgrep-$version"
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip" -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expectedHash = '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
          if ($actualHash -ne $expectedHash) {
            throw "ripgrep archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $rg = Join-Path $extract "ripgrep-$version-x86_64-pc-windows-msvc/rg.exe"
          if (-not (Test-Path -LiteralPath $rg -PathType Leaf)) {
            throw 'Pinned ripgrep archive did not contain rg.exe.'
          }
          "XHARNESS_RG=$rg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package native host
        run: |
          $package = "dist/xharness-host-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -LiteralPath "target/release/xharness-host.exe" -Destination $package
          Copy-Item -LiteralPath "target/release/xharness-windows-sandbox-runner.exe" -Destination $package
          Copy-Item -LiteralPath $env:XHARNESS_RG -Destination $package
          New-Item -ItemType Directory -Force -Path "$package/config" | Out-Null
          Copy-Item -LiteralPath "config/providers.deepseek.example.json" -Destination "$package/config"
          Copy-Item -LiteralPath "scripts/start-windows.ps1" -Destination $package
          Copy-Item -LiteralPath "ui/dist" -Destination "$package/ui" -Recurse
          $archive = "dist/xharness-host-windows-x86_64.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  xharness-host-windows-x86_64.zip" | Set-Content -Encoding ascii "$archive.sha256"
      - name: Upload native host
        uses: actions/upload-artifact@v7
        with:
          name: xharness-host-windows-x86_64
          path: |
            dist/xharness-host-windows-x86_64.zip
            dist/xharness-host-windows-x86_64.zip.sha256
          if-no-files-found: error
      - name: Stage Windows Tauri sidecars
        run: |
          $target = 'x86_64-pc-windows-msvc'
          python scripts/stage-tauri-sidecar.py target/release/xharness-host.exe $target
          python scripts/stage-tauri-sidecar.py $env:XHARNESS_RG $target --name rg
          python scripts/stage-tauri-sidecar.py target/release/xharness-windows-sandbox-runner.exe $target --name xharness-windows-sandbox-runner
      - name: Check native Tauri desktop shell
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          python scripts/test-windows-desktop-bundle.py
          node scripts/test-desktop-updater.mjs
      - name: Build installable Windows application
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          projectPath: apps/desktop
          args: >-
            --target x86_64-pc-windows-msvc
            --bundles nsis
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Hash Windows installer
        run: |
          $bundle = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: XHarness-windows-x64
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
          if-no-files-found: error

  rust-macos-arm64:
    name: Rust / macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Verify native Apple Silicon runner
        run: test "$(uname -s)-$(uname -m)" = "Darwin-arm64"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build native host
        run: cargo build --locked --release -p xharness-host-app
      - name: Check native Tauri desktop shell
        run: |
          command -v rg >/dev/null || brew install ripgrep
          python3 scripts/stage-tauri-sidecar.py target/release/xharness-host aarch64-apple-darwin
          python3 scripts/stage-tauri-sidecar.py "$(command -v rg)" aarch64-apple-darwin --name rg
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build installable macOS application
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          projectPath: apps/desktop
          args: >-
            --target aarch64-apple-darwin
            --bundles app
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify packaged icon, UI and version
        run: |
          node scripts/test-desktop-updater.mjs
          python3 scripts/test-desktop-assets.py --app apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XHarness.app
      - name: Package macOS application
        run: |
          ditto -c -k --keepParent \
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XHarness.app \
            dist/XHarness-macos-arm64.zip
          shasum -a 256 dist/XHarness-macos-arm64.zip > dist/XHarness-macos-arm64.zip.sha256
      - name: Upload macOS application
        uses: actions/upload-artifact@v7
        with:
          name: XHarness-macos-arm64
          path: |
            dist/XHarness-macos-arm64.zip
            dist/XHarness-macos-arm64.zip.sha256
          if-no-files-found: error
      - name: Package native host
        run: |
          command -v rg >/dev/null || brew install ripgrep
          mkdir -p dist/xharness-host-darwin-arm64
          cp target/release/xharness-host dist/xharness-host-darwin-arm64/
          cp "$(command -v rg)" dist/xharness-host-darwin-arm64/
          tar -C dist/xharness-host-darwin-arm64 -czf dist/xharness-host-darwin-arm64.tar.gz xharness-host rg
          cd dist
          shasum -a 256 xharness-host-darwin-arm64.tar.gz > xharness-host-darwin-arm64.tar.gz.sha256
      - name: Upload native host
        uses: actions/upload-artifact@v7
        with:
          name: xharness-host-darwin-arm64
          path: |
            dist/xharness-host-darwin-arm64.tar.gz
            dist/xharness-host-darwin-arm64.tar.gz.sha256
          if-no-files-found: error

  desktop-linux:
    name: Tauri Desktop / Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ripgrep
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Stage debug Host sidecar
        run: |
          cargo build --locked -p xharness-host-app
          TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          python3 scripts/stage-tauri-sidecar.py target/debug/xharness-host "$TARGET"
          python3 scripts/stage-tauri-sidecar.py "$(command -v rg)" "$TARGET" --name rg
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: node scripts/test-desktop-updater.mjs
      - run: node scripts/test-model-settings-ui.mjs
      - run: node scripts/test-updater-signature.mjs
      - run: python3 scripts/test-desktop-assets.py
      - run: python3 scripts/test-desktop-release.py
