name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  release-checkpoints:
    name: Durable release checkpoint rehearsal (no signing keys)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked checkpoint SDK
        run: npm ci --prefix .github/actions/desktop-release-service --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/desktop-release-service
        with:
          rehearsal: 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unix-update-rehearsal:
    name: Native Unix signed update rehearsal
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: update-channel-contract
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/desktop-unix-update-acceptance.yml
    with:
      mode: rehearsal

  update-channel-contract:
    name: Update channel contract / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the portable contract suite once. The exact master
        # SHA still runs the three native shells before it may be released.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-2025","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked source UI toolchain for desktop script contracts
        run: npm ci --prefix ui --ignore-scripts
      - run: node scripts/test-update-channel-bridge.mjs
      - run: node scripts/test-macos-preview-bridge.mjs
      - run: node scripts/test-migration-acceptance-guards.mjs
      - run: node scripts/test-install-ownership-contract.mjs
      - run: node scripts/test-desktop-bootstrap.mjs
      - run: node scripts/test-desktop-startup.mjs
      - run: node scripts/test-desktop-titlebar.mjs
      - run: python -B scripts/test-linux-appimage-compat.py
      - run: node scripts/test-runtime-diagnostics.mjs
      - run: python -B scripts/test-desktop-symbols.py
      - run: node scripts/test-updater-signature.mjs
      - run: python -B scripts/test-friends-release.py
      - run: python -B scripts/test-unified-desktop-release.py
      - run: python -B scripts/test-desktop-release-build.py
      - run: python -B scripts/test-release-orchestrator.py
      - run: python -B scripts/test-release-service.py
      - run: python -B scripts/test-ci-tiering.py
      - run: python -B scripts/test-macos-signing.py
      - run: python -B scripts/test-macos-stable-signing.py
      - run: python -B scripts/test-windows-desktop-bundle.py
      - run: python -B scripts/test-windows-runtime-audit.py
      - run: python -B scripts/test-browser-windows-manifest.py
      - name: Unix updater isolation and candidate contracts
        if: runner.os != 'Windows'
        run: python3 -B scripts/test-unix-update-acceptance.py
      - run: python -B scripts/test-live-model-workflow.py
      - run: python -B scripts/test-desktop-release.py
      - run: node scripts/test-desktop-windows-acceptance.mjs
      - run: node scripts/test-windows-cache-rehearsal.mjs
      - name: Real Tauri signer with disposable keys (no native compilation)
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: ./scripts/test-update-channel-signer.ps1
      - name: Fast Windows Shell reconciliation regression (no Rust build)
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -File scripts/test-install-ownership-fixture.ps1
          if ($LASTEXITCODE) { throw 'Windows Shell reconciliation regression failed' }

  cloud-offline-guards:
    name: Cloud lifecycle offline guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Only local fixture tests: no VM lifecycle, SSH, vendor Key or model calls.
      - run: python3 -B scripts/test-cloud-vm-lab.py
      - run: python3 -B scripts/test-cloud-dedicated-vm.py
      - run: python3 -B scripts/test-cloud-native-acceptance.py
      - run: python3 -B scripts/test-cloud-goal-acceptance.py

  # Preserve the existing required check. A failed/skipped/cancelled matrix must
  # never turn into a green merge gate through `if: always()`.
  context-layout:
    name: Harness layout / Chromium + WebKit
    needs: [ui-build, ui-contracts, ui-browser, ui-parity]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Require every UI shard and parity gate
        env:
          UI_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-ui-gate.mjs

  ui-build:
    name: UI / locked build and shard contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked source UI toolchain
        run: npm ci --prefix ui --ignore-scripts
      - name: Validate sharding, baseline coverage and fail-closed gate
        run: |
          node --test scripts/test-ci-ui-suite.mjs
          python3 -B scripts/test-ci-tiering.py
      - name: Check committed artifacts, strict types and deterministic build
        run: node scripts/ci-ui-suite.mjs --suite build
      - name: Seal same-run UI artifact (not a compiler cache)
        run: |
          node scripts/ci-ui-artifact.mjs --write "$RUNNER_TEMP/ui-build-receipt.json"
          tar -czf "$RUNNER_TEMP/ui-build.tar.gz" ui/dist
      - uses: actions/upload-artifact@v7
        with:
          name: ui-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ui-build.tar.gz
            ${{ runner.temp }}/ui-build-receipt.json
          retention-days: 3
          if-no-files-found: error
      - name: Upload build timing receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-timing-build
          path: dist/ci-ui-timings/
          if-no-files-found: warn

  ui-contracts:
    name: UI contracts / shard ${{ matrix.shard }}
    needs: ui-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked source UI toolchain
        run: npm ci --prefix ui --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: ui-build-${{ github.sha }}
          path: ${{ runner.temp }}/ui-build
      - name: Restore and verify this exact run's UI build
        run: |
          tar -xzf "$RUNNER_TEMP/ui-build/ui-build.tar.gz"
          node scripts/ci-ui-artifact.mjs --verify "$RUNNER_TEMP/ui-build/ui-build-receipt.json"
      - name: Run all assigned contracts (isolated test processes)
        run: node scripts/ci-ui-suite.mjs --suite contract --shard ${{ matrix.shard }} --shards 4
      - name: Upload contract timing and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-contract-evidence-${{ matrix.shard }}
          path: dist/
          if-no-files-found: warn

  ui-browser:
    name: UI browser / ${{ matrix.browser }} / shard ${{ matrix.shard }}
    needs: ui-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        browser: [chromium, webkit]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            scripts/ui-test-deps/package-lock.json
      - name: Install locked source UI toolchain
        run: npm ci --prefix ui --ignore-scripts
      - name: Managed account source and IPC regressions
        run: |
          node --test scripts/test-settings-models-source.mjs
          python3 scripts/test-managed-account-ipc.py
      - name: Install isolated locked browser test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/ui-tests"
          cp scripts/ui-test-deps/package*.json "$RUNNER_TEMP/ui-tests/"
          (cd "$RUNNER_TEMP/ui-tests" && npm ci --ignore-scripts)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ui-browser-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('scripts/ui-test-deps/package-lock.json') }}
      # Runtime Linux libraries are still installed on every fresh runner.
      - name: Install selected browser and system libraries
        run: node "$RUNNER_TEMP/ui-tests/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v8
        with:
          name: ui-build-${{ github.sha }}
          path: ${{ runner.temp }}/ui-build
      - name: Restore and verify this exact run's UI build
        run: |
          tar -xzf "$RUNNER_TEMP/ui-build/ui-build.tar.gz"
          node scripts/ci-ui-artifact.mjs --verify "$RUNNER_TEMP/ui-build/ui-build-receipt.json"
      - name: Run source, legacy and layout fixtures for this engine
        env:
          UI_TEST_DEPS: ${{ runner.temp }}/ui-tests
        run: node scripts/ci-ui-suite.mjs --suite browser --browser ${{ matrix.browser }} --shard ${{ matrix.shard }} --shards 4
      - name: Upload browser timing and evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-browser-evidence-${{ matrix.browser }}-${{ matrix.shard }}
          path: dist/
          if-no-files-found: warn

  ui-parity:
    name: UI / committed and rebuilt strict pixel parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            scripts/ui-test-deps/package-lock.json
      - name: Install locked source UI toolchain
        run: npm ci --prefix ui --ignore-scripts
      - name: Install isolated locked browser test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/ui-tests"
          cp scripts/ui-test-deps/package*.json "$RUNNER_TEMP/ui-tests/"
          (cd "$RUNNER_TEMP/ui-tests" && npm ci --ignore-scripts)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ui-browser-${{ runner.os }}-both-${{ hashFiles('scripts/ui-test-deps/package-lock.json') }}
      - name: Install both browsers and system libraries
        run: node "$RUNNER_TEMP/ui-tests/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Strict committed platform and full plugin graph parity
        env:
          UI_TEST_DEPS: ${{ runner.temp }}/ui-tests
        run: node scripts/ci-ui-suite.mjs --suite parity --phase before
      - name: Rebuild without substituting a reference tree
        run: npm run build --prefix ui
      - name: Strict rebuilt platform and full plugin graph parity
        env:
          UI_TEST_DEPS: ${{ runner.temp }}/ui-tests
        run: node scripts/ci-ui-suite.mjs --suite parity --phase after
      - name: Upload strict parity timing and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-source-ui-evidence
          path: dist/
          if-no-files-found: warn

  rust-linux:
    name: Rust / Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked UI toolchain for native wire and desktop contracts
        run: npm ci --prefix ui --ignore-scripts
      - name: Regression harness and architecture contract
        run: |
          python3 -B scripts/regression/check-architecture.py
          python3 -B -m unittest scripts/regression/test_check_architecture.py
          python3 -B scripts/regression/summarize.py --help >/dev/null
          bash -n scripts/regression/remote-regression.sh
          bash -n scripts/regression/run-suite.sh
      - name: Token calibration historical backfill regression
        run: python3 -B scripts/test-token-calibration-backfill.py
      - name: Test optional Windows release contract without secrets
        run: python3 -B scripts/test-friends-release.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install search integration test dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: cargo fmt --check --all
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - name: Rust terminal DTOs generate the shipped TypeScript codec and satisfy UI lifecycle
        env:
          XHARNESS_SESSION_TERMINAL_EXPORT: ${{ runner.temp }}/session-terminal-contract
        run: |
          cargo test --locked -p xharness-projection export_session_terminal_contract
          node scripts/generate-session-terminal-contract.mjs --from "$XHARNESS_SESSION_TERMINAL_EXPORT" --check
          node --test scripts/test-session-terminal-contract.mjs
      - name: Real Rust fork announcements and lists cross the production WebSocket and HTTP decoders
        env:
          XHARNESS_FORK_WIRE_EXPORT: ${{ runner.temp }}/fork-wire.json
        run: |
          cargo test --locked -p xharness-host export_fork_wire_contract
          node --test scripts/test-fork-wire-contract.mjs
      - name: Goal remote HTTP replies match shipped client schemas
        env:
          XHARNESS_GOAL_REMOTE_FIXTURE: ${{ runner.temp }}/goal-remote-replies.json
        run: |
          cargo test -p xharness-host-app --test goal_remotes
          node scripts/test-goal-remote-contract.mjs "$XHARNESS_GOAL_REMOTE_FIXTURE"
      - name: Native plugin replies match checked TypeScript DTOs
        env:
          XHARNESS_PLUGIN_WIRE_FIXTURE: ${{ runner.temp }}/plugin-wire-replies.json
        run: |
          cargo test --locked -p xharness-host-app --test plugin_wire_contract
          node scripts/test-plugin-wire-contract.mjs "$XHARNESS_PLUGIN_WIRE_FIXTURE"
      - name: Native GitHub replies match checked TypeScript DTOs
        env:
          XHARNESS_GITHUB_WIRE_FIXTURE: ${{ runner.temp }}/github-wire.json
        run: |
          cargo test --locked -p xharness-host-app --lib github_service
          node --test scripts/test-github-review.mjs
      - name: Runtime-drop process cleanup without another concurrent Tokio runtime
        if: runner.os != 'Windows'
        run: cargo test --locked -p xharness-process --test process dropping_ -- --test-threads=1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-windows:
    name: Rust / Windows x86_64
    runs-on: windows-2025
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable Mac signing policy on Windows (no credentials or native signing)
        run: python -B scripts/test-macos-stable-signing.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked UI toolchain for native wire and desktop contracts
        run: npm ci --prefix ui --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install pinned ripgrep for the portable package
        run: |
          $version = '15.2.0'
          $archive = Join-Path $env:RUNNER_TEMP "ripgrep-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ripgrep-$version"
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip" -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expectedHash = '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
          if ($actualHash -ne $expectedHash) {
            throw "ripgrep archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $rg = Join-Path $extract "ripgrep-$version-x86_64-pc-windows-msvc/rg.exe"
          if (-not (Test-Path -LiteralPath $rg -PathType Leaf)) {
            throw 'Pinned ripgrep archive did not contain rg.exe.'
          }
          "XHARNESS_RG=$rg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $rg) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo fmt --check --all
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - name: Native GitHub replies match checked TypeScript DTOs
        env:
          XHARNESS_GITHUB_WIRE_FIXTURE: ${{ runner.temp }}/github-wire.json
        run: |
          cargo test --locked -p xharness-host-app --lib github_service
          node --test scripts/test-github-review.mjs
      - name: Runtime-drop process cleanup without another concurrent Tokio runtime
        if: runner.os != 'Windows'
        run: cargo test --locked -p xharness-process --test process dropping_ -- --test-threads=1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build native host and sandbox runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cargo build --locked --release -p xharness-host-app -p xharness-sandbox --bins
      - name: Package native host
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          $package = "dist/xharness-host-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -LiteralPath "target/x86_64-pc-windows-msvc/release/xharness-host.exe" -Destination $package
          Copy-Item -LiteralPath "target/x86_64-pc-windows-msvc/release/xharness-windows-sandbox-runner.exe" -Destination $package
          Copy-Item -LiteralPath $env:XHARNESS_RG -Destination $package
          New-Item -ItemType Directory -Force -Path "$package/config" | Out-Null
          Copy-Item -LiteralPath "config/providers.remote.example.json" -Destination "$package/config"
          Copy-Item -LiteralPath "scripts/start-windows.ps1" -Destination $package
          Copy-Item -LiteralPath "ui/dist" -Destination "$package/ui" -Recurse
          $archive = "dist/xharness-host-windows-x86_64.zip"
          python -B scripts/audit-windows-runtime.py --directory $package --portable-host --output dist/windows-runtime-audit/portable.json
          if ($LASTEXITCODE) { throw 'Portable Windows runtime dependency audit failed' }
          Compress-Archive -Path "$package/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  xharness-host-windows-x86_64.zip" | Set-Content -Encoding ascii "$archive.sha256"
      - name: Upload native host
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: xharness-host-windows-x86_64
          path: |
            dist/xharness-host-windows-x86_64.zip
            dist/xharness-host-windows-x86_64.zip.sha256
          if-no-files-found: error
      - name: Stage Windows Tauri sidecars
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          $target = 'x86_64-pc-windows-msvc'
          python scripts/stage-tauri-sidecar.py target/x86_64-pc-windows-msvc/release/xharness-host.exe $target
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          python scripts/stage-tauri-sidecar.py $env:XHARNESS_RG $target --name rg
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          python scripts/stage-tauri-sidecar.py target/x86_64-pc-windows-msvc/release/xharness-windows-sandbox-runner.exe $target --name xharness-windows-sandbox-runner
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
      - name: Stage debug Windows sidecars for PR smoke
        if: github.event_name == 'pull_request'
        run: |
          $target = 'x86_64-pc-windows-msvc'
          cargo build --locked -p xharness-host-app -p xharness-sandbox --bins
          if ($LASTEXITCODE) { throw 'Windows PR sidecar build failed' }
          python scripts/stage-tauri-sidecar.py target/x86_64-pc-windows-msvc/debug/xharness-host.exe $target
          if ($LASTEXITCODE) { throw 'Windows PR host staging failed' }
          python scripts/stage-tauri-sidecar.py $env:XHARNESS_RG $target --name rg
          if ($LASTEXITCODE) { throw 'Windows PR search staging failed' }
          python scripts/stage-tauri-sidecar.py target/x86_64-pc-windows-msvc/debug/xharness-windows-sandbox-runner.exe $target --name xharness-windows-sandbox-runner
          if ($LASTEXITCODE) { throw 'Windows PR sandbox staging failed' }
      - name: Check native Tauri desktop shell
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --no-run
          if ($LASTEXITCODE) { throw 'Windows native test build failed' }
          $tests = Get-ChildItem apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/debug/deps/xharness_desktop-*.exe
          if (-not $tests) { throw 'Windows desktop test binary missing' }
          foreach ($test in $tests) {
            ./scripts/gui_bench/windows_imports.ps1 -Binary $test.FullName -EvidenceDir "dist/native-browser-evidence/windows/unit-$($test.BaseName)"
          }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE) { throw 'Windows native validation command failed (see unit activation/import evidence)' }
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          python scripts/test-windows-desktop-bundle.py
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          node scripts/test-desktop-updater.mjs
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
      - name: Native WebView DOM callback/actions on Windows (no model or OS input)
        run: |
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --example browser-inspect-probe
          if ($LASTEXITCODE) { throw 'Windows native DOM probe build failed' }
          ./scripts/gui_bench/windows_imports.ps1 -Binary apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/debug/examples/browser-inspect-probe.exe -EvidenceDir dist/native-browser-evidence/windows
          python scripts/gui_bench/run_native_probe.py apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/debug/examples/browser-inspect-probe.exe --evidence-dir dist/native-browser-evidence/windows
          if ($LASTEXITCODE) {
            # Preserve loader evidence rather than treating pre-main failure as
            # a DOM/model failure or silently skipping the native contract.
            Get-ChildItem apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/debug -Filter '*.dll' -Recurse | Select-Object FullName,Length | ConvertTo-Json > dist/native-browser-evidence/windows/build-dlls.json
            throw 'Windows native DOM probe failed'
          }
      - name: Upload Windows native DOM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-browser-dom-windows
          path: dist/native-browser-evidence/windows/
          if-no-files-found: warn
      - name: Build installable Windows application
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: windows-bundle
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          projectPath: apps/desktop
          args: >-
            --target x86_64-pc-windows-msvc
            --bundles nsis
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Audit final extracted Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          python -B scripts/audit-windows-runtime.py --installer $installers[0].FullName --expected-desktop apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/xharness-desktop.exe --sidecars apps/desktop/src-tauri/binaries --output dist/windows-runtime-audit/installer.json
          if ($LASTEXITCODE) { throw 'Final Windows runtime dependency audit failed' }
      - name: Hash Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          $bundle = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - name: Native installation ownership and crash acceptance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          ./scripts/test-install-ownership-logic.ps1 -DesktopBinary apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/xharness-desktop.exe
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -File scripts/test-install-ownership-logic.ps1 -DesktopBinary apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/xharness-desktop.exe
          if ($LASTEXITCODE) { throw 'Windows PowerShell 5.1 installer logic failed' }
          ./scripts/test-windows-install-ownership.ps1 -Installer $installer.FullName -RuntimeAudit dist/windows-runtime-audit/installer.json
      - name: Upload installation ownership evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: installation-ownership-evidence
          path: |
            dist/install-ownership-evidence
            dist/windows-runtime-audit/
          if-no-files-found: warn
      - name: Upload Windows application
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.windows-bundle.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: XHarness-windows-x64
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
          if-no-files-found: error

  macos-fixed-signing-contract:
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed certificate signing across two disposable native app versions (no production keys or Rust)
        run: python3 -B scripts/test-macos-stable-signing.py --native

  rust-macos-arm64:
    name: Rust / macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked UI toolchain for native wire and desktop contracts
        run: npm ci --prefix ui --ignore-scripts
      - name: Verify native Apple Silicon runner
        run: test "$(uname -s)-$(uname -m)" = "Darwin-arm64"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install portable search before integration tests
        run: bash scripts/install-portable-rg.sh
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - name: Native GitHub replies match checked TypeScript DTOs
        env:
          XHARNESS_GITHUB_WIRE_FIXTURE: ${{ runner.temp }}/github-wire.json
        run: |
          cargo test --locked -p xharness-host-app --lib github_service
          node --test scripts/test-github-review.mjs
      - name: Runtime-drop process cleanup without another concurrent Tokio runtime
        if: runner.os != 'Windows'
        run: cargo test --locked -p xharness-process --test process dropping_ -- --test-threads=1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Stage debug macOS sidecars for PR smoke
        if: github.event_name == 'pull_request'
        run: |
          cargo build --locked -p xharness-host-app
          export PATH="$RUNNER_TEMP/xharness-portable-rg/bin:$PATH"
          python3 scripts/stage-tauri-sidecar.py target/debug/xharness-host aarch64-apple-darwin
          python3 scripts/stage-tauri-sidecar.py "$(command -v rg)" aarch64-apple-darwin --name rg
      - name: Build native host
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cargo build --locked --release -p xharness-host-app
      - name: Stage macOS Tauri sidecars
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          bash scripts/install-portable-rg.sh
          export PATH="$RUNNER_TEMP/xharness-portable-rg/bin:$PATH"
          python3 scripts/stage-tauri-sidecar.py target/release/xharness-host aarch64-apple-darwin
          python3 scripts/stage-tauri-sidecar.py "$(command -v rg)" aarch64-apple-darwin --name rg
      - name: Check native Tauri desktop shell
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Native WebView DOM callback/actions on macOS (no model or OS input)
        run: |
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --example browser-inspect-probe
          python3 scripts/gui_bench/run_native_probe.py apps/desktop/src-tauri/target/debug/examples/browser-inspect-probe --evidence-dir dist/native-browser-evidence/macos
          python3 scripts/gui_bench/run_native_probe.py apps/desktop/src-tauri/target/debug/examples/browser-inspect-probe --macos-titlebar overlay --evidence-dir dist/native-browser-evidence/macos-overlay
      - name: Upload macOS native DOM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-browser-dom-macos
          path: |
            dist/native-browser-evidence/macos/
            dist/native-browser-evidence/macos-overlay/
          if-no-files-found: warn
      - name: Retain exact macOS probe executable for no-recompile diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-browser-probe-macos-arm64
          path: apps/desktop/src-tauri/target/debug/examples/browser-inspect-probe
          if-no-files-found: warn
          retention-days: 3
      - name: Build installable macOS application
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          projectPath: apps/desktop
          args: >-
            --target aarch64-apple-darwin
            --bundles app
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify packaged icon, UI and version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          node scripts/test-desktop-updater.mjs
          python3 scripts/test-desktop-assets.py --app apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XHarness.app
      - name: Package macOS application
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          ditto -c -k --keepParent \
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XHarness.app \
            dist/XHarness-macos-arm64.zip
          shasum -a 256 dist/XHarness-macos-arm64.zip > dist/XHarness-macos-arm64.zip.sha256
      - name: Upload macOS application
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: XHarness-macos-arm64
          path: |
            dist/XHarness-macos-arm64.zip
            dist/XHarness-macos-arm64.zip.sha256
          if-no-files-found: error
      - name: Package native host
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          bash scripts/install-portable-rg.sh
          export PATH="$RUNNER_TEMP/xharness-portable-rg/bin:$PATH"
          mkdir -p dist/xharness-host-darwin-arm64
          cp target/release/xharness-host dist/xharness-host-darwin-arm64/
          cp "$(command -v rg)" dist/xharness-host-darwin-arm64/
          tar -C dist/xharness-host-darwin-arm64 -czf dist/xharness-host-darwin-arm64.tar.gz xharness-host rg
          cd dist
          shasum -a 256 xharness-host-darwin-arm64.tar.gz > xharness-host-darwin-arm64.tar.gz.sha256
      - name: Upload native host
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: xharness-host-darwin-arm64
          path: |
            dist/xharness-host-darwin-arm64.tar.gz
            dist/xharness-host-darwin-arm64.tar.gz.sha256
          if-no-files-found: error

  desktop-linux:
    name: Tauri Desktop / Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ripgrep xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Stage debug Host sidecar
        run: |
          cargo build --locked -p xharness-host-app
          TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          python3 scripts/stage-tauri-sidecar.py target/debug/xharness-host "$TARGET"
          python3 scripts/stage-tauri-sidecar.py "$(command -v rg)" "$TARGET" --name rg
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Native WebView DOM callback/actions on Linux (no model or OS input)
        run: |
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --example browser-inspect-probe
          python3 scripts/gui_bench/run_native_probe.py apps/desktop/src-tauri/target/debug/examples/browser-inspect-probe --evidence-dir dist/native-browser-evidence/linux
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked UI toolchain for native desktop contracts
        run: npm ci --prefix ui --ignore-scripts
      - name: Production BrowserPane and native task/action contracts (zero API)
        run: |
          npm install --prefix "$RUNNER_TEMP/native-react" --no-save --package-lock=false react@18.3.1 react-dom@18.3.1
          mkdir -p "$RUNNER_TEMP/native-assets"
          cp "$RUNNER_TEMP/native-react/node_modules/react/umd/react.production.min.js" "$RUNNER_TEMP/native-assets/react.js"
          cp "$RUNNER_TEMP/native-react/node_modules/react-dom/umd/react-dom.production.min.js" "$RUNNER_TEMP/native-assets/react-dom.js"
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --example native-browser-bench
          python3 -B -m scripts.gui_bench.run_webview --contract --tasks issue,pr,dynamic,game --host-binary target/debug/xharness-host --native-binary apps/desktop/src-tauri/target/debug/examples/native-browser-bench --assets "$RUNNER_TEMP/native-assets" --evidence-dir dist/native-browser-evidence/linux/binding
          python3 -B -m scripts.gui_bench.run_webview --contract --zero-tabs --tasks issue,pr,dynamic,game --host-binary target/debug/xharness-host --native-binary apps/desktop/src-tauri/target/debug/examples/native-browser-bench --assets "$RUNNER_TEMP/native-assets" --evidence-dir dist/native-browser-evidence/linux/zero-tabs
      - name: Upload Linux native DOM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-browser-dom-linux
          path: dist/native-browser-evidence/linux/
          if-no-files-found: warn
      - run: node scripts/test-desktop-updater.mjs
      - run: node scripts/test-model-settings-ui.mjs
      - run: node scripts/test-updater-signature.mjs
      - run: python3 scripts/test-desktop-assets.py
      - run: python3 scripts/test-desktop-release.py
