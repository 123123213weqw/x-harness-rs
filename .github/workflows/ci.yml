name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  unix-update-rehearsal:
    name: Native Unix signed update rehearsal
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: update-channel-contract
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/desktop-unix-update-acceptance.yml
    with:
      mode: rehearsal

  update-channel-contract:
    name: Update channel contract / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the portable contract suite once. The exact master
        # SHA still runs the three native shells before it may be released.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-2025","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked source UI toolchain for desktop script contracts
        run: npm ci --prefix ui --ignore-scripts
      - run: node scripts/test-update-channel-bridge.mjs
      - run: node scripts/test-macos-preview-bridge.mjs
      - run: node scripts/test-migration-acceptance-guards.mjs
      - run: node scripts/test-install-ownership-contract.mjs
      - run: node scripts/test-desktop-bootstrap.mjs
      - run: node scripts/test-desktop-startup.mjs
      - run: node scripts/test-desktop-titlebar.mjs
      - run: python -B scripts/test-linux-appimage-compat.py
      - run: node scripts/test-runtime-diagnostics.mjs
      - run: python -B scripts/test-desktop-symbols.py
      - run: node scripts/test-updater-signature.mjs
      - run: python -B scripts/test-friends-release.py
      - run: python -B scripts/test-unified-desktop-release.py
      - run: python -B scripts/test-desktop-release-build.py
      - run: python -B scripts/test-release-orchestrator.py
      - run: python -B scripts/test-ci-tiering.py
      - run: python -B scripts/test-macos-signing.py
      - run: python -B scripts/test-windows-desktop-bundle.py
      - name: Unix updater isolation and candidate contracts
        if: runner.os != 'Windows'
        run: python3 -B scripts/test-unix-update-acceptance.py
      - run: python -B scripts/test-live-model-workflow.py
      - run: python -B scripts/test-desktop-release.py
      - run: node scripts/test-desktop-windows-acceptance.mjs
      - name: Real Tauri signer with disposable keys (no native compilation)
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: ./scripts/test-update-channel-signer.ps1
      - name: Fast Windows Shell reconciliation regression (no Rust build)
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -File scripts/test-install-ownership-fixture.ps1
          if ($LASTEXITCODE) { throw 'Windows Shell reconciliation regression failed' }

  context-layout:
    name: Context and Harness layout / Chromium + WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check repository UI build and types
        run: |
          npm ci --prefix ui --ignore-scripts
          npm run typecheck --prefix ui
          npm run check:plugin-api --prefix ui
          npm run check:build --prefix ui
          npm run build --prefix ui
          npm run check:build --prefix ui
          node --test scripts/test-standalone-ui-build.mjs
          node --test scripts/test-ui-migration-reference.mjs scripts/test-owned-ui-type-policy.mjs scripts/test-source-module-builder.mjs scripts/test-plugin-api-types.mjs scripts/test-owned-script-assets.mjs
          node scripts/test-foundation-source-modules.mjs
          node scripts/test-product-source-modules.mjs
          node scripts/test-view-source-modules.mjs
          node scripts/test-model-selection-source.mjs
          node scripts/test-attachment-source.mjs
          node scripts/test-settings-models-source.mjs
          node scripts/test-preset-source-modules.mjs
          node scripts/test-renderer-source-module.mjs
          node scripts/test-workspace-source-module.mjs
          node scripts/test-cordis-source-module.mjs
          node scripts/test-owned-cordis-services.mjs
          node scripts/test-conversation-service-boundaries.mjs
          node scripts/test-conversation-main-differential.mjs
          node scripts/test-conversation-history-rollback.mjs
          node scripts/test-conversation-connection-boundaries.mjs
          UI_TEST_IMPL=source node scripts/test-layout-workspace-source.mjs
          UI_TEST_IMPL=legacy node scripts/test-layout-workspace-source.mjs
          node scripts/test-question-source-module.mjs
          node scripts/test-tool-source-module.mjs
          node scripts/test-conversation-source.mjs
          node scripts/test-goal-source.mjs
          node scripts/test-trajectory-source-module.mjs
          node --test scripts/test-plugin-api.mjs
      - name: Install isolated UI test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-tests" --no-save --package-lock=false playwright@1.61.1 react@18.3.1 react-dom@18.3.1
          node "$RUNNER_TEMP/ui-tests/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - run: python3 -B scripts/test-remote-sync.py
      - run: node scripts/test-execution-checkpoints.mjs
      - run: node scripts/test-attachments.mjs
      - run: node scripts/test-conversation-message-edit.mjs
      - run: node scripts/test-internal-queue.mjs
      - run: node scripts/test-max-tokens-notice.mjs
      - run: node scripts/test-context-plugin.mjs
      - run: node scripts/test-profile-plugin.mjs
      - run: node scripts/test-plugin-center.mjs
      - run: node scripts/test-terminal-plugin.mjs
      - run: node scripts/test-tasks-plugin.mjs
      - run: node scripts/test-motion-plugin.mjs
      - run: node scripts/test-motion-tokens.mjs
      - run: node scripts/test-compaction-ui.mjs
      - run: node scripts/test-compaction-progress.mjs
      - run: node scripts/test-compaction-projection.mjs
      - run: node scripts/test-compaction-wire.mjs
      - run: node scripts/test-conversation-scroll-follow.mjs
      - run: node scripts/test-computer-ui.mjs
      - run: node scripts/test-brand-headline.mjs
      - run: node scripts/test-brand-identity.mjs
      - run: node scripts/test-logo-gradient.mjs
      - run: node scripts/test-logo-motion.mjs
      - run: node scripts/test-monochrome-theme.mjs
      - run: node scripts/test-silver-surface.mjs
      - run: node scripts/test-context-accounting.mjs
      - run: node scripts/test-assistant-projection.mjs
      - run: node scripts/test-retry-turn-projection.mjs
      - run: node scripts/test-network-wait-ui.mjs
      - run: node scripts/test-atomic-history.mjs
      - run: node scripts/test-ui-lifecycle-recovery.mjs
      - run: node scripts/test-live-answer-recovery.mjs
      - run: node scripts/test-startup-catalog-refresh.mjs
      - run: node scripts/test-permission-selection.mjs
      - run: node --check scripts/assemble-static-ui.mjs
      - run: node scripts/test-model-controls.mjs
      - run: node scripts/test-upstream-ui-experience.mjs
      - run: node scripts/test-workspace-directory.mjs
      - run: node scripts/test-browser-ui.mjs
      - run: node scripts/test-browser-window-controller.mjs
      - run: node scripts/test-workspace-created-at.mjs
      - run: node scripts/test-settings-save-feedback.mjs
      - name: Source migration browser differential regression
        env:
          UI_TEST_DEPS: ${{ runner.temp }}/ui-tests
        run: |
          for browser in chromium webkit; do
            UI_TEST_BROWSER="$browser" node scripts/test-script-assets-browser.mjs
            UI_TEST_BROWSER="$browser" node scripts/test-chat-scroll-intent-browser.mjs
            for implementation in source legacy; do
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-renderer-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-workspace-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-model-selection-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-attachment-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-settings-models-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-tool-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-conversation-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-trajectory-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-tasks-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-profile-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-cordis-source-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-owned-view-persistence-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-plugin-hub-functional.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-browser-dock-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-browser-dock-native-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-browser-persistence-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-browser-restore-runtime.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-question-continuation-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-goal-runtime-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-approval-prompt-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-workspace-directory-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-request-audit-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-conversation-message-edit-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-attachments-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-execution-checkpoints-browser.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-streaming-math.mjs
              UI_TEST_BROWSER="$browser" UI_TEST_IMPL="$implementation" node scripts/test-compaction-progress-browser.mjs
            done
          done
          node scripts/test-platform-source-browser.mjs
          node scripts/test-owned-ui-boot-differential.mjs
      - name: Real browser layout regression
        env:
          UI_TEST_DEPS: ${{ runner.temp }}/ui-tests
        run: |
          UI_TEST_BROWSER=chromium node scripts/test-page-priority-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-page-priority-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-context-layout.mjs
          UI_TEST_BROWSER=chromium node scripts/test-plugin-center-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-plugin-hub-functional.mjs
          UI_TEST_BROWSER=webkit node scripts/test-context-layout.mjs
          UI_TEST_BROWSER=webkit node scripts/test-plugin-center-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-plugin-hub-functional.mjs
          UI_TEST_BROWSER=chromium node scripts/test-motion-tokens-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-motion-tokens-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-terminal-layout-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-terminal-layout-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-settings-save-feedback-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-settings-save-feedback-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-desktop-updater-layer.mjs
          node scripts/test-runtime-diagnostics-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-desktop-updater-layer.mjs
          UI_TEST_BROWSER=chromium node scripts/test-model-controls-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-model-controls-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-upstream-ui-experience-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-upstream-ui-experience-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-subagent-navigation.mjs
          UI_TEST_BROWSER=webkit node scripts/test-subagent-navigation.mjs
          UI_TEST_BROWSER=chromium node scripts/test-workspace-directory-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-workspace-directory-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-browser-pane-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-browser-pane-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-browser-dock-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-browser-dock-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-browser-dock-native-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-browser-dock-native-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-browser-native-bridge.mjs
          UI_TEST_BROWSER=webkit node scripts/test-browser-native-bridge.mjs
          UI_TEST_BROWSER=chromium node scripts/test-browser-access.mjs
          UI_TEST_BROWSER=webkit node scripts/test-browser-access.mjs
          UI_TEST_BROWSER=chromium node scripts/test-browser-persistence-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-browser-persistence-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-browser-restore-runtime.mjs
          UI_TEST_BROWSER=webkit node scripts/test-browser-restore-runtime.mjs
          UI_TEST_BROWSER=chromium node scripts/test-conversation-message-edit-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-conversation-message-edit-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-attachments-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-attachments-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-execution-checkpoints-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-execution-checkpoints-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-streaming-math.mjs
          UI_TEST_BROWSER=webkit node scripts/test-streaming-math.mjs
          UI_TEST_BROWSER=chromium node scripts/test-session-history-cache.mjs
          UI_TEST_BROWSER=webkit node scripts/test-session-history-cache.mjs
          node scripts/test-transcript-row-state.mjs
          UI_TEST_BROWSER=chromium node scripts/test-transcript-windowing.mjs
          UI_TEST_BROWSER=webkit node scripts/test-transcript-windowing.mjs
          UI_TEST_BROWSER=chromium node scripts/test-compaction-progress-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-compaction-progress-browser.mjs
          node scripts/test-question-continuation-patch.mjs
          UI_TEST_BROWSER=chromium node scripts/test-question-continuation-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-question-continuation-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-approval-prompt-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-approval-prompt-browser.mjs
          node scripts/test-goal-runtime-patch.mjs
          node scripts/test-ui-namespace.mjs
          UI_TEST_BROWSER=chromium node scripts/test-goal-runtime-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-goal-runtime-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-computer-ui-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-computer-ui-browser.mjs
          UI_TEST_BROWSER=chromium node scripts/test-request-audit-browser.mjs
          UI_TEST_BROWSER=webkit node scripts/test-request-audit-browser.mjs
      - name: Upload workspace directory UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-directory-ui-evidence
          path: dist/workspace-directory-evidence/
          if-no-files-found: warn

      - name: Upload approval prompt UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: approval-prompt-ui-evidence
          path: dist/approval-ui/
          if-no-files-found: warn

  rust-linux:
    name: Rust / Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked UI toolchain for native wire and desktop contracts
        run: npm ci --prefix ui --ignore-scripts
      - name: Regression harness and architecture contract
        run: |
          python3 -B scripts/regression/check-architecture.py
          python3 -B -m unittest scripts/regression/test_check_architecture.py
          python3 -B scripts/regression/summarize.py --help >/dev/null
          bash -n scripts/regression/remote-regression.sh
          bash -n scripts/regression/run-suite.sh
      - name: Token calibration historical backfill regression
        run: python3 -B scripts/test-token-calibration-backfill.py
      - name: Test optional Windows release contract without secrets
        run: python3 -B scripts/test-friends-release.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install search integration test dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: cargo fmt --check --all
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - name: Goal remote HTTP replies match shipped client schemas
        env:
          XHARNESS_GOAL_REMOTE_FIXTURE: ${{ runner.temp }}/goal-remote-replies.json
        run: |
          cargo test -p xharness-host-app --test goal_remotes
          node scripts/test-goal-remote-contract.mjs "$XHARNESS_GOAL_REMOTE_FIXTURE"
      - name: Native plugin replies match checked TypeScript DTOs
        env:
          XHARNESS_PLUGIN_WIRE_FIXTURE: ${{ runner.temp }}/plugin-wire-replies.json
        run: |
          cargo test --locked -p xharness-host-app --test plugin_wire_contract
          node scripts/test-plugin-wire-contract.mjs "$XHARNESS_PLUGIN_WIRE_FIXTURE"
      - name: Runtime-drop process cleanup without another concurrent Tokio runtime
        if: runner.os != 'Windows'
        run: cargo test --locked -p xharness-process --test process dropping_ -- --test-threads=1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-windows:
    name: Rust / Windows x86_64
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked UI toolchain for native wire and desktop contracts
        run: npm ci --prefix ui --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install pinned ripgrep for the portable package
        run: |
          $version = '15.2.0'
          $archive = Join-Path $env:RUNNER_TEMP "ripgrep-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ripgrep-$version"
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip" -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expectedHash = '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
          if ($actualHash -ne $expectedHash) {
            throw "ripgrep archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $rg = Join-Path $extract "ripgrep-$version-x86_64-pc-windows-msvc/rg.exe"
          if (-not (Test-Path -LiteralPath $rg -PathType Leaf)) {
            throw 'Pinned ripgrep archive did not contain rg.exe.'
          }
          "XHARNESS_RG=$rg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $rg) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo fmt --check --all
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - name: Runtime-drop process cleanup without another concurrent Tokio runtime
        if: runner.os != 'Windows'
        run: cargo test --locked -p xharness-process --test process dropping_ -- --test-threads=1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build native host and sandbox runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cargo build --locked --release -p xharness-host-app -p xharness-sandbox --bins
      - name: Package native host
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          $package = "dist/xharness-host-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -LiteralPath "target/release/xharness-host.exe" -Destination $package
          Copy-Item -LiteralPath "target/release/xharness-windows-sandbox-runner.exe" -Destination $package
          Copy-Item -LiteralPath $env:XHARNESS_RG -Destination $package
          New-Item -ItemType Directory -Force -Path "$package/config" | Out-Null
          Copy-Item -LiteralPath "config/providers.remote.example.json" -Destination "$package/config"
          Copy-Item -LiteralPath "scripts/start-windows.ps1" -Destination $package
          Copy-Item -LiteralPath "ui/dist" -Destination "$package/ui" -Recurse
          $archive = "dist/xharness-host-windows-x86_64.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  xharness-host-windows-x86_64.zip" | Set-Content -Encoding ascii "$archive.sha256"
      - name: Upload native host
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: xharness-host-windows-x86_64
          path: |
            dist/xharness-host-windows-x86_64.zip
            dist/xharness-host-windows-x86_64.zip.sha256
          if-no-files-found: error
      - name: Stage Windows Tauri sidecars
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          $target = 'x86_64-pc-windows-msvc'
          python scripts/stage-tauri-sidecar.py target/release/xharness-host.exe $target
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          python scripts/stage-tauri-sidecar.py $env:XHARNESS_RG $target --name rg
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          python scripts/stage-tauri-sidecar.py target/release/xharness-windows-sandbox-runner.exe $target --name xharness-windows-sandbox-runner
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
      - name: Stage debug Windows sidecars for PR smoke
        if: github.event_name == 'pull_request'
        run: |
          $target = 'x86_64-pc-windows-msvc'
          cargo build --locked -p xharness-host-app -p xharness-sandbox --bins
          if ($LASTEXITCODE) { throw 'Windows PR sidecar build failed' }
          python scripts/stage-tauri-sidecar.py target/debug/xharness-host.exe $target
          if ($LASTEXITCODE) { throw 'Windows PR host staging failed' }
          python scripts/stage-tauri-sidecar.py $env:XHARNESS_RG $target --name rg
          if ($LASTEXITCODE) { throw 'Windows PR search staging failed' }
          python scripts/stage-tauri-sidecar.py target/debug/xharness-windows-sandbox-runner.exe $target --name xharness-windows-sandbox-runner
          if ($LASTEXITCODE) { throw 'Windows PR sandbox staging failed' }
      - name: Check native Tauri desktop shell
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          python scripts/test-windows-desktop-bundle.py
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
          node scripts/test-desktop-updater.mjs
          if ($LASTEXITCODE) { throw 'Windows native validation command failed' }
      - name: Native WebView DOM callback/actions on Windows (no model or OS input)
        run: |
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --example browser-inspect-probe
          if ($LASTEXITCODE) { throw 'Windows native DOM probe build failed' }
          ./scripts/gui_bench/windows_imports.ps1 -Binary apps/desktop/src-tauri/target/debug/examples/browser-inspect-probe.exe -EvidenceDir dist/native-browser-evidence/windows
          python scripts/gui_bench/run_native_probe.py apps/desktop/src-tauri/target/debug/examples/browser-inspect-probe.exe --evidence-dir dist/native-browser-evidence/windows
          if ($LASTEXITCODE) {
            # Preserve loader evidence rather than treating pre-main failure as
            # a DOM/model failure or silently skipping the native contract.
            Get-ChildItem apps/desktop/src-tauri/target/debug -Filter '*.dll' -Recurse | Select-Object FullName,Length | ConvertTo-Json > dist/native-browser-evidence/windows/build-dlls.json
            throw 'Windows native DOM probe failed'
          }
      - name: Upload Windows native DOM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-browser-dom-windows
          path: dist/native-browser-evidence/windows/
          if-no-files-found: warn
      - name: Build installable Windows application
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: windows-bundle
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          projectPath: apps/desktop
          args: >-
            --target x86_64-pc-windows-msvc
            --bundles nsis
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Hash Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          $bundle = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - name: Native installation ownership and crash acceptance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          ./scripts/test-install-ownership-logic.ps1 -DesktopBinary apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/xharness-desktop.exe
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -File scripts/test-install-ownership-logic.ps1 -DesktopBinary apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/xharness-desktop.exe
          if ($LASTEXITCODE) { throw 'Windows PowerShell 5.1 installer logic failed' }
          ./scripts/test-windows-install-ownership.ps1 -Installer $installer.FullName
      - name: Upload installation ownership evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: installation-ownership-evidence
          path: dist/install-ownership-evidence/
          if-no-files-found: warn
      - name: Upload Windows application
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.windows-bundle.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: XHarness-windows-x64
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
          if-no-files-found: error

  rust-macos-arm64:
    name: Rust / macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked UI toolchain for native wire and desktop contracts
        run: npm ci --prefix ui --ignore-scripts
      - name: Verify native Apple Silicon runner
        run: test "$(uname -s)-$(uname -m)" = "Darwin-arm64"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install portable search before integration tests
        run: bash scripts/install-portable-rg.sh
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - name: Runtime-drop process cleanup without another concurrent Tokio runtime
        if: runner.os != 'Windows'
        run: cargo test --locked -p xharness-process --test process dropping_ -- --test-threads=1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Stage debug macOS sidecars for PR smoke
        if: github.event_name == 'pull_request'
        run: |
          cargo build --locked -p xharness-host-app
          export PATH="$RUNNER_TEMP/xharness-portable-rg/bin:$PATH"
          python3 scripts/stage-tauri-sidecar.py target/debug/xharness-host aarch64-apple-darwin
          python3 scripts/stage-tauri-sidecar.py "$(command -v rg)" aarch64-apple-darwin --name rg
      - name: Build native host
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cargo build --locked --release -p xharness-host-app
      - name: Stage macOS Tauri sidecars
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          bash scripts/install-portable-rg.sh
          export PATH="$RUNNER_TEMP/xharness-portable-rg/bin:$PATH"
          python3 scripts/stage-tauri-sidecar.py target/release/xharness-host aarch64-apple-darwin
          python3 scripts/stage-tauri-sidecar.py "$(command -v rg)" aarch64-apple-darwin --name rg
      - name: Check native Tauri desktop shell
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Native WebView DOM callback/actions on macOS (no model or OS input)
        run: |
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --example browser-inspect-probe
          python3 scripts/gui_bench/run_native_probe.py apps/desktop/src-tauri/target/debug/examples/browser-inspect-probe --evidence-dir dist/native-browser-evidence/macos
      - name: Upload macOS native DOM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-browser-dom-macos
          path: dist/native-browser-evidence/macos/
          if-no-files-found: warn
      - name: Build installable macOS application
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          projectPath: apps/desktop
          args: >-
            --target aarch64-apple-darwin
            --bundles app
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify packaged icon, UI and version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          node scripts/test-desktop-updater.mjs
          python3 scripts/test-desktop-assets.py --app apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XHarness.app
      - name: Package macOS application
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          ditto -c -k --keepParent \
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XHarness.app \
            dist/XHarness-macos-arm64.zip
          shasum -a 256 dist/XHarness-macos-arm64.zip > dist/XHarness-macos-arm64.zip.sha256
      - name: Upload macOS application
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: XHarness-macos-arm64
          path: |
            dist/XHarness-macos-arm64.zip
            dist/XHarness-macos-arm64.zip.sha256
          if-no-files-found: error
      - name: Package native host
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          bash scripts/install-portable-rg.sh
          export PATH="$RUNNER_TEMP/xharness-portable-rg/bin:$PATH"
          mkdir -p dist/xharness-host-darwin-arm64
          cp target/release/xharness-host dist/xharness-host-darwin-arm64/
          cp "$(command -v rg)" dist/xharness-host-darwin-arm64/
          tar -C dist/xharness-host-darwin-arm64 -czf dist/xharness-host-darwin-arm64.tar.gz xharness-host rg
          cd dist
          shasum -a 256 xharness-host-darwin-arm64.tar.gz > xharness-host-darwin-arm64.tar.gz.sha256
      - name: Upload native host
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: xharness-host-darwin-arm64
          path: |
            dist/xharness-host-darwin-arm64.tar.gz
            dist/xharness-host-darwin-arm64.tar.gz.sha256
          if-no-files-found: error

  desktop-linux:
    name: Tauri Desktop / Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ripgrep xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Stage debug Host sidecar
        run: |
          cargo build --locked -p xharness-host-app
          TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          python3 scripts/stage-tauri-sidecar.py target/debug/xharness-host "$TARGET"
          python3 scripts/stage-tauri-sidecar.py "$(command -v rg)" "$TARGET" --name rg
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Native WebView DOM callback/actions on Linux (no model or OS input)
        run: |
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --example browser-inspect-probe
          python3 scripts/gui_bench/run_native_probe.py apps/desktop/src-tauri/target/debug/examples/browser-inspect-probe --evidence-dir dist/native-browser-evidence/linux
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked UI toolchain for native desktop contracts
        run: npm ci --prefix ui --ignore-scripts
      - name: Production BrowserPane and native task/action contracts (zero API)
        run: |
          npm install --prefix "$RUNNER_TEMP/native-react" --no-save --package-lock=false react@18.3.1 react-dom@18.3.1
          mkdir -p "$RUNNER_TEMP/native-assets"
          cp "$RUNNER_TEMP/native-react/node_modules/react/umd/react.production.min.js" "$RUNNER_TEMP/native-assets/react.js"
          cp "$RUNNER_TEMP/native-react/node_modules/react-dom/umd/react-dom.production.min.js" "$RUNNER_TEMP/native-assets/react-dom.js"
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --example native-browser-bench
          python3 -B -m scripts.gui_bench.run_webview --contract --tasks issue,pr,dynamic,game --host-binary target/debug/xharness-host --native-binary apps/desktop/src-tauri/target/debug/examples/native-browser-bench --assets "$RUNNER_TEMP/native-assets" --evidence-dir dist/native-browser-evidence/linux/binding
      - name: Upload Linux native DOM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-browser-dom-linux
          path: dist/native-browser-evidence/linux/
          if-no-files-found: warn
      - run: node scripts/test-desktop-updater.mjs
      - run: node scripts/test-model-settings-ui.mjs
      - run: node scripts/test-updater-signature.mjs
      - run: python3 scripts/test-desktop-assets.py
      - run: python3 scripts/test-desktop-release.py
