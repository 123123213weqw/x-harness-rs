name: Live model acceptance

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: OpenAI-compatible endpoint the live runs talk to
        required: true
        default: https://api.example.com
        type: string
      model:
        description: Model route to exercise
        required: true
        default: chat-model
        type: string
      api_key_secret:
        description: Repository secret holding the endpoint credential
        required: true
        default: XHARNESS_LIVE_API_KEY
        type: string

permissions:
  contents: read

jobs:
  windows-long-coding:
    name: Windows / long coding
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      XHARNESS_LIVE_BASE_URL: ${{ inputs.base_url }}
      XHARNESS_LIVE_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require repository secret
        env:
          XHARNESS_LIVE_API_KEY: ${{ secrets[inputs.api_key_secret] }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:XHARNESS_LIVE_API_KEY)) {
            throw "Repository secret ${{ inputs.api_key_secret }} is not configured."
          }
      - name: Managed background-job behavior
        env:
          XHARNESS_LIVE_API_KEY: ${{ secrets[inputs.api_key_secret] }}
        run: cargo test --locked -p xharness-coding-tools --test live_loop live_model_uses_managed_jobs_instead_of_pty_or_nohup -- --ignored --nocapture
      - name: Long coding repair and debug evidence
        env:
          XHARNESS_LIVE_API_KEY: ${{ secrets[inputs.api_key_secret] }}
        run: cargo test --locked -p xharness-coding-tools --test live_loop live_model_repairs_code_and_emits_complete_debug_evidence -- --ignored --nocapture
      - name: Execution checkpoints preserve coding continuity
        env:
          XHARNESS_LIVE_API_KEY: ${{ secrets[inputs.api_key_secret] }}
        run: cargo test --locked -p xharness-coding-tools --test live_loop live_model_continues_coding_across_execution_checkpoints -- --ignored --nocapture
