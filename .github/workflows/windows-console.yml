name: Windows console boundaries

on:
  pull_request:
    paths:
      - 'crates/xharness-process/**'
      - 'crates/xharness-sandbox/**'
      - 'crates/xharness-win32/**'
      - 'crates/xharness-terminal/**'
      - 'crates/xharness-coding-tools/**'
      - 'crates/xharness-web-terminal/**'
      - 'scripts/fixtures/windows-no-console.ps1'
      - '.github/workflows/windows-console.yml'

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Repeat cold PowerShell console probe with phase evidence
        run: |
          1..5 | ForEach-Object {
            Write-Host "Console probe cold-process iteration $_ / 5"
            cargo test --locked -p xharness-process --test windows_process non_interactive_child_has_no_console_and_keeps_streams_and_exit_code -- --exact --nocapture
            if ($LASTEXITCODE) { throw "Console probe iteration $_ failed; see phase evidence above" }
          }
      - name: Native console, pipe, ACL, cancellation and ConPTY regressions
        run: cargo test --locked -p xharness-process -p xharness-sandbox -p xharness-terminal --all-targets -- --nocapture
      - name: Shell discovery and real command contracts (including forced no-PS7 search)
        run: |
          cargo test --locked -p xharness-coding-tools --test shell_resolution -- --nocapture
          if ($LASTEXITCODE) { throw 'Native shell resolver/tool contracts failed' }
      - name: Full coding and Web terminal regressions with built-in Windows PowerShell 5.1
        run: |
          $env:XHARNESS_SHELL = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          try {
            cargo test --locked -p xharness-coding-tools -p xharness-web-terminal --all-targets -- --nocapture
            if ($LASTEXITCODE) { throw 'Windows PowerShell 5.1 fallback regression failed' }
          } finally { Remove-Item Env:XHARNESS_SHELL }
