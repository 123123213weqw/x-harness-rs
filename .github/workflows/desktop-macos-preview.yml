name: Desktop macOS preview channel

# Rolling, unnotarized macOS preview channel.
#
# Why this exists: the stable `desktop-v*` channel cannot produce macOS at all while the
# repository holds no Apple Developer ID/notarization secrets, and the rehearsal channel
# (`desktop-test-v*`) compiles a *per-version* endpoint into the binary, so an installed
# rehearsal build can never observe a later version. This workflow keeps one fixed release
# tag whose `latest.json` is replaced on every run, which is the only shape the updater can
# follow: the endpoint is compiled in with `option_env!`
# (apps/desktop/src-tauri/src/updater.rs:16), so it must stay the same URL forever.
#
# Channel contract:
#   endpoint   https://github.com/<repo>/releases/download/desktop-preview/latest.json
#   trust key  the preview updater public key (secrets below)
#   layout     `latest.json` is the single mutable file; every package keeps a
#              version-specific name, so a package URL never changes meaning
#   guards     the version must increase, and a run may add a platform but never drop one
#              the channel already serves
#
# The packages are ad-hoc signed and NOT notarized: Gatekeeper blocks the first launch, and
# the manifest carries `macos_distribution: ad-hoc-unnotarized-preview` to say so. These
# builds must never enter the stable channel; `Desktop Release`/`Desktop Promote` stay the
# only writers of `desktop-v*` and of the rolling stable entry.
#
# Keypair: set secrets XHARNESS_PREVIEW_UPDATER_PRIVATE_KEY / _PASSWORD / _PUBKEY to adopt a
# dedicated preview keypair. Without them the rehearsal keypair is reused, which needs no
# setup but means a rehearsal build and a preview build trust the same packages. Because the
# endpoint and key are compiled in, a user coming from the rehearsal channel or from a
# previous keypair must install this channel's package once by hand.
#
# Not mirrored to Gitee on purpose: the mirror skips pre-releases and these packages are
# ~22 MiB each.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.20; must exceed what the channel already serves"
        required: true
        type: string
      include_intel:
        description: "Also build darwin-x86_64 (Intel); once served, that platform can never be dropped"
        type: boolean
        default: false
      dry_run:
        description: "Build and verify only; do not create or update the preview release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-macos-preview
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PREVIEW_TAG: desktop-preview
  XHARNESS_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
  XHARNESS_UPDATER_PUBKEY: ${{ secrets.XHARNESS_FRIENDS_PUBLIC_KEY }}

jobs:
  plan:
    if: github.ref == 'refs/heads/local/mac-install-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate the version and select targets
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          INCLUDE_INTEL: ${{ inputs.include_intel }}
        run: |
          set -euo pipefail
          [[ -n "${XHARNESS_UPDATER_PUBKEY:-}" ]] || { echo '::error::no preview updater public key is configured'; exit 1; }
          gh release download "${PREVIEW_TAG}" --pattern latest.json --dir existing --clobber 2>/dev/null || true
          python3 - <<'PY'
          import json,os,re
          version = os.environ['VERSION']
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version), 'plain major.minor.patch required'
          targets = [{'platform': 'darwin-aarch64', 'target': 'aarch64-apple-darwin', 'runner': 'macos-15', 'arch': 'aarch64'}]
          if os.environ['INCLUDE_INTEL'] == 'true':
              targets.append({'platform': 'darwin-x86_64', 'target': 'x86_64-apple-darwin', 'runner': 'macos-15-intel', 'arch': 'x86_64'})
          key = lambda value: tuple(int(part) for part in value.split('.'))
          if os.path.exists('existing/latest.json'):
              existing = json.load(open('existing/latest.json', encoding='utf-8'))
              assert key(version) > key(existing['version']), 'channel already serves ' + existing['version']
              served = set(existing['platforms'])
              selected = {item['platform'] for item in targets}
              assert served <= selected, 'refusing to drop channel platform(s): ' + ', '.join(sorted(served - selected))
              print('existing channel version:', existing['version'], sorted(served))
          else:
              print('preview channel does not exist yet')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as sink:
              sink.write('matrix=' + json.dumps({'include': targets}) + '\n')
              sink.write('version=' + version + '\n')
          PY

  build:
    needs: plan
    name: Build ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      # Ad-hoc signing is the declared policy of this channel; no Apple identity is used.
      APPLE_SIGNING_IDENTITY: '-'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.XHARNESS_FRIENDS_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.XHARNESS_FRIENDS_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: No-secret updater contracts
        run: |
          node scripts/test-desktop-updater.mjs
          node scripts/test-updater-signature.mjs
          python3 -B scripts/test-desktop-release.py
      - name: Native Host, sidecars and the desktop shell
        run: |
          set -euo pipefail
          bash scripts/install-portable-rg.sh
          export PATH="$RUNNER_TEMP/xharness-portable-rg/bin:$PATH"
          cargo build --locked --release -p xharness-host-app
          python3 scripts/stage-tauri-sidecar.py target/release/xharness-host "$TARGET"
          python3 scripts/stage-tauri-sidecar.py "$(command -v rg)" "$TARGET" --name rg
          cargo test --locked -p xharness-computer-macos
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build and ad-hoc sign the preview package
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          mkdir -p "dist/desktop-macos-preview/$PLATFORM"
          out="dist/desktop-macos-preview/$PLATFORM"
          # Kept inside the platform directory on purpose: with two matrix workers an
          # artifact-merged root copy would race on the same file name.
          printf '%s' "$XHARNESS_UPDATER_PUBKEY" > "$out/updater-preview.pub"
          printf '%s' "$XHARNESS_UPDATER_ENDPOINT" > "$out/endpoint.txt"
          python3 scripts/prepare-desktop-test-version.py "$VERSION"
          ( cd apps/desktop && npm exec --yes --package @tauri-apps/cli@2.11.4 -- tauri build --target "$TARGET" --bundles app )
          bundle="apps/desktop/src-tauri/target/$TARGET/release/bundle/macos"
          codesign --verify --deep --strict "$bundle/XHarness.app"
          python3 scripts/test-desktop-assets.py --app "$bundle/XHarness.app"
          node scripts/verify-updater-package.mjs "$bundle/XHarness.app.tar.gz" "$bundle/XHarness.app.tar.gz.sig" "$out/updater-preview.pub"
          cp "$bundle/XHarness.app.tar.gz" "$out/XHarness_${VERSION}_${ARCH}.app.tar.gz"
          cp "$bundle/XHarness.app.tar.gz.sig" "$out/XHarness_${VERSION}_${ARCH}.app.tar.gz.sig"
          ditto -c -k --keepParent "$bundle/XHarness.app" "$out/XHarness_${VERSION}_${ARCH}.zip"
          python3 - <<'PY'
          import json,os,pathlib
          platform = os.environ['PLATFORM']
          arch = os.environ['ARCH']
          version = os.environ['VERSION']
          out = pathlib.Path('dist/desktop-macos-preview') / platform
          package = f'XHarness_{version}_{arch}.app.tar.gz'
          entry = {'platform': platform,
                   'package': package,
                   'signature': (out / (package + '.sig')).read_text().strip()}
          (out / 'entry.json').write_text(json.dumps(entry, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-${{ matrix.platform }}
          path: dist/desktop-macos-preview/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [plan, build]
    if: github.ref == 'refs/heads/master' && inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: preview-*
          path: dist/artifacts
          merge-multiple: true
      - name: Assemble the rolling manifest
        run: |
          set -euo pipefail
          mkdir -p dist/preview
          cp "$(ls -d dist/artifacts/darwin-*/ | head -1)updater-preview.pub" dist/preview/updater-preview.pub
          python3 - <<'PY'
          import datetime,json,os,pathlib
          version = os.environ['VERSION']
          tag = os.environ['PREVIEW_TAG']
          repository = os.environ['GITHUB_REPOSITORY']
          root = pathlib.Path('dist/artifacts')
          destination = pathlib.Path('dist/preview')
          destination.mkdir(parents=True, exist_ok=True)
          entries = {}
          for entry_path in sorted(root.glob('darwin-*/entry.json')):
              entry = json.loads(entry_path.read_text(encoding='utf-8'))
              platform = entry['platform']
              assert platform not in entries, 'duplicate platform build'
              entries[platform] = {
                  'signature': entry['signature'],
                  'url': f'https://github.com/{repository}/releases/download/{tag}/{entry["package"]}',
              }
          assert entries, 'no platform build was collected'
          manifest = {
              'version': version,
              'notes': ('XHarness macOS 未公证预览（滚动通道）：ad-hoc 签名，未完成 Apple 公证。'
                        '首次安装需在「系统设置 → 隐私与安全性」放行，或用右键「打开」确认；'
                        '之后本通道内的新版本会在应用内自动提示更新。这是预览版，不是稳定版。'),
              'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'macos_distribution': 'ad-hoc-unnotarized-preview',
              'platforms': entries,
          }
          (destination / 'latest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('platforms:', sorted(entries))
          PY
          for platform in darwin-aarch64 darwin-x86_64; do
            [[ -d "dist/artifacts/$platform" ]] || continue
            cp dist/artifacts/$platform/XHarness_* dist/preview/
          done
          ls -l dist/preview
          ( cd dist/preview && sha256sum XHarness_* updater-preview.pub latest.json > SHA256SUMS )
      - name: Publish the preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## XHarness macOS 未公证预览（滚动通道）

          这是 **预览** 通道，不是稳定版：包使用 ad-hoc 代码签名，**未完成 Apple 公证**。

          ### 第一次安装（只需一次）

          1. 下载下面的 `XHarness_<版本>_<架构>.zip`，解压得到 `XHarness.app`。
          2. 拖到「应用程序」。首次启动会被 Gatekeeper 拦下：右键点击 → **打开**，
             或到「系统设置 → 隐私与安全性 → 仍要打开」放行。
          3. 之后本通道的新版本会在应用内提示更新，不需要再手动下载。

          只有从这里安装的包才带滚动更新源。演练通道（`desktop-test-*`）的包或旧密钥签的包
          不会收到自动更新，必须重新从这里安装一次。

          ### 说明

          - 更新源固定为 `releases/download/desktop-preview/latest.json`，每次发布替换它，
            所以这个通道可以持续更新；`latest.json` 里带有
            `macos_distribution: ad-hoc-unnotarized-preview` 标记。
          - 每次发布的包名带版本号，旧版本资产保留，便于回滚。
          - 稳定通道（Windows/Linux，以及将来的已公证 macOS）仍然只由
            `Desktop Release` / `Desktop Promote` 写入，本工作流不会碰它。
          EOF
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            echo "updating the existing $PREVIEW_TAG release"
            gh release edit "$PREVIEW_TAG" --prerelease --latest=false --title "XHarness macOS 未公证预览（滚动通道）" --notes-file notes.md
          else
            gh release create "$PREVIEW_TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "XHarness macOS 未公证预览（滚动通道）" --notes-file notes.md
          fi
          gh release upload "$PREVIEW_TAG" dist/preview/* --clobber
      - name: Verify the public rolling endpoint
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$XHARNESS_UPDATER_ENDPOINT" -o live.json; then break; fi
            sleep $((attempt * attempt * 3))
          done
          python3 - <<'PY'
          import json,os
          live = json.load(open('live.json', encoding='utf-8'))
          built = json.load(open('dist/preview/latest.json', encoding='utf-8'))
          assert live == built, 'the published rolling manifest differs from the built one'
          assert live['version'] == os.environ['VERSION'], 'rolling entry serves the wrong version'
          assert live['macos_distribution'] == 'ad-hoc-unnotarized-preview', 'preview policy is not declared'
          print('rolling preview entry verified:', live['version'], sorted(live['platforms']))
          PY
