name: GUI Acceptance Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/gui_bench/**'
      - 'plugins/browser-use/**'
      - 'apps/desktop/src-tauri/**'
      - 'scripts/terminal_bench/broker.py'
      - 'crates/xharness-computer*/**'
      - 'crates/xharness-host-app/**'
      - '.github/workflows/gui-bench-build.yml'

permissions:
  contents: read

concurrency:
  group: gui-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  budget-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s scripts/terminal_bench -p test_broker.py -v
      - run: python3 -B -m unittest scripts.gui_bench.test_budget scripts.gui_bench.test_runner scripts.gui_bench.test_native_probe -v

  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install isolated browser dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/gui-tests" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/gui-tests/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Real Chromium MCP regression (no API spending)
        env:
          UI_TEST_DEPS: ${{ runner.temp }}/gui-tests
        run: |
          node scripts/gui_bench/test_browser.mjs
          node scripts/gui_bench/test_native_observation.mjs

  macos-host:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p xharness-computer -p xharness-computer-macos
      - run: cargo test --locked -p xharness-host-app deployment_allowlist
      - run: cargo test --locked -p xharness-host-app tool_allowlist
      - run: cargo test --locked -p xharness-host-app plugin_mcp
      - run: cargo test --locked -p xharness-host deployment_policy_fences
      - run: cargo test --locked -p xharness-mcp
      - run: cargo build --locked --release -p xharness-host-app
      - name: Record exact candidate source
        run: |
          mkdir -p dist/gui-candidate
          cp target/release/xharness-host dist/gui-candidate/
          git rev-parse HEAD > dist/gui-candidate/source-sha.txt
          shasum -a 256 dist/gui-candidate/xharness-host > dist/gui-candidate/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: gui-bench-host-macos-arm64
          path: dist/gui-candidate/
          if-no-files-found: error
          retention-days: 7
