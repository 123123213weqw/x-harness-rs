name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write
  actions: read

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-desktop-updater.mjs
      - run: python3 scripts/test-desktop-assets.py
      - name: Require successful CI for the exact release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          success=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "master" and .conclusion == "success")] | length')
          test "$success" -gt 0 || { echo 'Run CI on master successfully before creating a desktop version tag.'; exit 1; }
  publish:
    needs: verify
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-15
            target: aarch64-apple-darwin
            host_binary: target/aarch64-apple-darwin/release/xharness-host
          - name: Linux x86_64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            host_binary: target/x86_64-unknown-linux-gnu/release/xharness-host
          - name: Windows x64
            platform: windows-2025
            target: x86_64-pc-windows-msvc
            host_binary: target/x86_64-pc-windows-msvc/release/xharness-host.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate tag matches desktop version
        if: matrix.platform != 'windows-2025'
        shell: bash
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')"
          test "${GITHUB_REF_NAME}" = "desktop-v${VERSION}" || {
            echo "tag ${GITHUB_REF_NAME} does not match desktop-v${VERSION}"
            exit 1
          }
      - name: Validate tag matches desktop version on Windows
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        run: |
          $version = python -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])"
          if ($env:GITHUB_REF_NAME -ne "desktop-v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match desktop-v$version"
          }
      - name: Validate updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          XHARNESS_UPDATER_PUBKEY: ${{ secrets.XHARNESS_UPDATER_PUBKEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'missing TAURI_SIGNING_PRIVATE_KEY'; exit 1; }
          test -n "$XHARNESS_UPDATER_PUBKEY" || { echo 'missing XHARNESS_UPDATER_PUBKEY'; exit 1; }
      - name: Validate Apple signing and notarization configuration
        if: matrix.platform == 'macos-15'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "missing ${name}"; exit 1; }
          done
      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ripgrep
      - name: Install ripgrep on macOS
        if: matrix.platform == 'macos-15'
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Install pinned ripgrep on Windows
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        run: |
          $version = '15.2.0'
          $archive = Join-Path $env:RUNNER_TEMP "ripgrep-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ripgrep-$version"
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip" -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expectedHash = '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
          if ($actualHash -ne $expectedHash) {
            throw "ripgrep archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $rg = Join-Path $extract "ripgrep-$version-x86_64-pc-windows-msvc/rg.exe"
          if (-not (Test-Path -LiteralPath $rg -PathType Leaf)) {
            throw 'Pinned ripgrep archive did not contain rg.exe.'
          }
          "XHARNESS_RG=$rg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Build and stage Host sidecar
        if: matrix.platform != 'windows-2025'
        run: |
          cargo build --locked --release -p xharness-host-app --target "${{ matrix.target }}"
          python3 scripts/stage-tauri-sidecar.py "${{ matrix.host_binary }}" "${{ matrix.target }}"
          python3 scripts/stage-tauri-sidecar.py "$(command -v rg)" "${{ matrix.target }}" --name rg
      - name: Build and stage Windows sidecars
        if: matrix.platform == 'windows-2025'
        shell: pwsh
        run: |
          $target = '${{ matrix.target }}'
          cargo build --locked --release -p xharness-host-app --target $target
          cargo build --locked --release -p xharness-sandbox --bin xharness-windows-sandbox-runner --target $target
          python scripts/stage-tauri-sidecar.py '${{ matrix.host_binary }}' $target
          python scripts/stage-tauri-sidecar.py $env:XHARNESS_RG $target --name rg
          python scripts/stage-tauri-sidecar.py "target/$target/release/xharness-windows-sandbox-runner.exe" $target --name xharness-windows-sandbox-runner
      - name: Build, sign and publish desktop bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          XHARNESS_UPDATER_ENDPOINT: https://github.com/123123213weqw/x-harness-rs/releases/latest/download/latest.json
          XHARNESS_UPDATER_PUBKEY: ${{ secrets.XHARNESS_UPDATER_PUBKEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: XHarness Desktop __VERSION__
          releaseBody: XHarness desktop installers and signed updater metadata.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}
      - name: Verify released macOS bundle assets
        if: matrix.platform == 'macos-15'
        run: python3 scripts/test-desktop-assets.py --app apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XHarness.app
