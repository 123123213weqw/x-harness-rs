name: Desktop Release
run-name: ${{ inputs.orchestration_id && format('release-task {0}', inputs.orchestration_id) || 'Desktop Release' }}

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Optional opaque correlation ID from scripts/release.py
        required: false
        type: string
      integrated_acceptance:
        description: Run native upgrades in the signing workers using the complete immutable candidate
        required: false
        type: boolean
        default: false
      automatic_candidate:
        description: Immutable tag dispatch for automatic four-platform preparation only
        required: false
        type: boolean
        default: false
      expected_ci_run_id:
        description: Automatic candidate CI identity, never rebound
        required: false
        type: string
      expected_ci_attempt:
        description: Automatic candidate CI attempt, never rebound
        required: false
        type: string
      prepare_tag:
        description: Unified entry only; create immutable tag with GITHUB_TOKEN (no duplicate push build)
        required: false
        type: boolean
        default: false
      expected_sha:
        description: Unified entry source lock; master movement is rejected before tag creation
        required: false
        type: string
      release_tag:
        description: Existing desktop-vMAJOR.MINOR.PATCH tag at this exact green master commit
        required: true
        type: string
      expected_macos_signing_fingerprint:
        description: Optional immutable publisher pin from the release task
        required: false
        type: string
      release_scope:
        description: Selected platforms; `all` requires Apple Developer ID and notarization secrets, preview policies are explicit (ad-hoc or fixed publisher self-signature), neither is notarized
        type: choice
        options: [all, windows-linux, all-macos-preview, all-macos-selfsigned]
        default: all-macos-preview
        required: true

# Matrix workers cannot write a release or replace latest.json.
permissions:
  contents: read
  actions: read

concurrency:
  # Candidate builds cannot hold the publication lock or displace its pending job.
  # Ordinary manual releases retain group: desktop-stable-release.
  group: ${{ inputs.automatic_candidate && format('desktop-candidate-build-{0}', inputs.release_tag) || 'desktop-stable-release' }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  XHARNESS_FRIENDS_RELEASE_REPOSITORY: ${{ vars.XHARNESS_FRIENDS_RELEASE_REPOSITORY }}
  XHARNESS_MACOS_PREVIEW_CERT_SHA1: ${{ vars.XHARNESS_MACOS_PREVIEW_CERT_SHA1 }}
  EXPECTED_MACOS_SIGNING_FINGERPRINT: ${{ inputs.expected_macos_signing_fingerprint }}

jobs:
  plan:
    permissions:
      contents: write # Tag creation only; candidate publication remains in aggregate/promote.
      actions: read
    if: vars.XHARNESS_FRIENDS_RELEASE_REPOSITORY == github.repository && (github.event_name == 'push' || github.ref == 'refs/heads/master' || (inputs.automatic_candidate && startsWith(github.ref, 'refs/tags/desktop-v')))
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      endpoint: ${{ steps.plan.outputs.endpoint }}
      integrated: ${{ inputs.integrated_acceptance }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked source UI toolchain
        run: npm ci --prefix ui --ignore-scripts
      - name: Prepare immutable tag for unified entry
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
          RELEASE_SCOPE_INPUT: ${{ inputs.release_scope }}
        run: python3 -B scripts/desktop-release-build.py prepare-tag
      - name: Validate tag, master source and latest successful exact-SHA CI
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This repository distributes unnotarized Mac previews to opted-in users.
          # Keep the long-lived feed populated for both Mac architectures.
          # `all` still requires Apple credentials; no automatic signing fallback.
          # Operators may explicitly choose windows-linux before Mac is published;
          # promotion refuses to silently drop platforms from an existing feed.
          INTEGRATED_ACCEPTANCE: ${{ inputs.integrated_acceptance }}
          AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
          EXPECTED_CI_RUN_ID: ${{ inputs.expected_ci_run_id }}
          EXPECTED_CI_ATTEMPT: ${{ inputs.expected_ci_attempt }}
          RELEASE_SCOPE_INPUT: ${{ inputs.release_scope || vars.XHARNESS_DESKTOP_TAG_RELEASE_SCOPE || 'all-macos-preview' }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || github.ref_name }}
          XHARNESS_FRIENDS_RELEASE_REPOSITORY: ${{ vars.XHARNESS_FRIENDS_RELEASE_REPOSITORY }}
        run: python3 -B scripts/desktop-release-build.py plan --output dist/desktop-plan/plan.json
      - name: Fail early unless every selected platform meets its explicit signing policy
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.XHARNESS_FRIENDS_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.XHARNESS_FRIENDS_PASSWORD }}
          XHARNESS_UPDATER_PUBKEY: ${{ secrets.XHARNESS_FRIENDS_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 -B scripts/desktop-release-build.py signing-plan --plan dist/desktop-plan/plan.json
      - name: No-secret release and updater contracts
        run: |
          node scripts/test-desktop-updater.mjs
          node scripts/test-updater-signature.mjs
          python3 -B scripts/test-desktop-assets.py
          python3 -B scripts/test-linux-appimage-compat.py
          python3 -B scripts/test-desktop-release.py
          python3 -B scripts/test-desktop-release-build.py
          python3 -B scripts/test-desktop-candidates.py
          python3 -B scripts/test-desktop-candidate-idle.py
          python3 -B scripts/test-macos-signing.py
          python3 -B scripts/test-windows-desktop-bundle.py
          python3 -B scripts/test-unified-desktop-release.py
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-plan
          path: dist/desktop-plan/plan.json
          if-no-files-found: error
          retention-days: ${{ inputs.automatic_candidate && 14 || 90 }}

  build:
    needs: plan
    name: Signed ${{ matrix.platform }} candidate
    environment:
      name: ${{ matrix.macos_selfsigned && 'macos-preview-signing' || 'desktop-release' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # Empty until the native-only ingestion endpoint is deployed and accepted.
      ZSTD_CLEVEL: '1' # Cache archives only; release optimization and symbols are unchanged.
      AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      XHARNESS_INSTALLATION_ENDPOINT: ${{ vars.XHARNESS_INSTALLATION_ENDPOINT }}
      XHARNESS_RELEASE_CHANNEL: stable
      XHARNESS_UPDATER_ENDPOINT: ${{ needs.plan.outputs.endpoint }}
      XHARNESS_UPDATER_PUBKEY: ${{ secrets.XHARNESS_FRIENDS_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked source UI toolchain
        run: npm ci --prefix ui --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: desktop-plan
          path: dist/desktop-plan
      - name: Require updater signing and plan-bound Apple policy
        env:
          XHARNESS_MACOS_PREVIEW_P12: ${{ secrets.XHARNESS_MACOS_PREVIEW_P12 }}
          XHARNESS_MACOS_PREVIEW_P12_PASSWORD: ${{ secrets.XHARNESS_MACOS_PREVIEW_P12_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.XHARNESS_FRIENDS_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.XHARNESS_FRIENDS_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python -B scripts/desktop-release-build.py signing-gate --platform '${{ matrix.platform }}' --plan dist/desktop-plan/plan.json
      - name: Install Linux AppImage dependencies
        if: matrix.platform == 'linux-x86_64-appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 ripgrep squashfs-tools xvfb dbus-x11
      - name: Install pinned Windows ripgrep
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ripgrep-15.2.0.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ripgrep-15.2.0'
          Invoke-WebRequest 'https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5') { throw 'ripgrep hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          "XHARNESS_RG=$extract/ripgrep-15.2.0-x86_64-pc-windows-msvc/rg.exe" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
          components: clippy
      - name: Preserve Windows release symbols without changing optimization
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          'CARGO_PROFILE_RELEASE_DEBUG=2' >> $env:GITHUB_ENV
          'CARGO_PROFILE_RELEASE_STRIP=none' >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        id: native-cache
        with:
          cache-workspace-crates: false
          cache-on-failure: true
          shared-key: desktop-native-${{ matrix.target }}
          # Salt only public compile-time configuration, never signing secrets.
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST XHARNESS_ACCOUNT_ORIGIN XHARNESS_INSTALLATION_ENDPOINT XHARNESS_RELEASE_CHANNEL
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Report native cache policy
        env:
          EXACT_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: |
          printf '### Native build cache\n\nExact dependency-cache hit: `%s`\n\nWorkspace caching: disabled (benchmark only). Cache compression: zstd level 1.\n' "$EXACT_CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore pinned portable ripgrep cache
        if: startsWith(matrix.platform, 'darwin-')
        id: portable-rg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xharness-portable-rg
          key: portable-rg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'scripts/install-portable-rg.sh', 'scripts/portable-rg-cache.py') }}
      - name: Install native macOS ripgrep
        if: startsWith(matrix.platform, 'darwin-')
        run: bash scripts/install-portable-rg.sh
      - name: Build and stage native Host and ripgrep
        run: |
          cargo build --locked --release -p xharness-host-app --target '${{ matrix.target }}'
          python -B scripts/desktop-release-build.py stage --platform '${{ matrix.platform }}' --target '${{ matrix.target }}'
      - name: Build and stage Windows ACL runner
        if: matrix.platform == 'windows-x86_64'
        run: |
          cargo build --locked --release -p xharness-sandbox --bin xharness-windows-sandbox-runner --target '${{ matrix.target }}'
          python scripts/stage-tauri-sidecar.py 'target/${{ matrix.target }}/release/xharness-windows-sandbox-runner.exe' '${{ matrix.target }}' --name xharness-windows-sandbox-runner
      - name: Native desktop regression tests
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --target '${{ matrix.target }}'
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --target '${{ matrix.target }}' -- -D warnings
      - name: Project updater public key into bundler config
        run: python -B scripts/desktop-release-build.py configure --plan dist/desktop-plan/plan.json --public-key dist/updater.pub
      # The bundler selects its Apple branch with `std::env::var_os`, which
      # reports a present-but-empty variable as `Some("")`. Blanking a variable
      # therefore still chooses certificate import and notarization, and the
      # ad-hoc preview fails importing an empty keychain certificate. The two
      # steps below keep the credentials undefined rather than empty; the
      # signing gate above already rejects a missing formal identity.
      - name: Build and sign desktop bundle (artifacts only)
        if: ${{ !matrix.macos_preview && !matrix.macos_selfsigned }}
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.XHARNESS_FRIENDS_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.XHARNESS_FRIENDS_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm exec --yes --package @tauri-apps/cli@2.11.4 -- tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - name: Build and sign ad-hoc Mac preview bundle (artifacts only)
        if: ${{ matrix.macos_preview || matrix.macos_selfsigned }}
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.XHARNESS_FRIENDS_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.XHARNESS_FRIENDS_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        run: npm exec --yes --package @tauri-apps/cli@2.11.4 -- tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - name: Import fixed publisher identity into an isolated runner keychain
        if: matrix.macos_selfsigned
        env:
          XHARNESS_MACOS_PREVIEW_P12: ${{ secrets.XHARNESS_MACOS_PREVIEW_P12 }}
          XHARNESS_MACOS_PREVIEW_P12_PASSWORD: ${{ secrets.XHARNESS_MACOS_PREVIEW_P12_PASSWORD }}
        run: python -B scripts/macos-stable-signing.py import
      - name: Sign fixed publisher Mac components, repack and sign final updater bytes
        if: matrix.macos_selfsigned
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.XHARNESS_FRIENDS_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.XHARNESS_FRIENDS_PASSWORD }}
        run: python -B scripts/desktop-release-build.py sign-stable-preview --plan dist/desktop-plan/plan.json --target '${{ matrix.target }}'
      - name: Remove incompatible bundled Linux desktop stack and re-sign final bytes
        if: matrix.platform == 'linux-x86_64-appimage'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.XHARNESS_FRIENDS_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.XHARNESS_FRIENDS_PASSWORD }}
        run: |
          package="src-tauri/target/${{ matrix.target }}/release/bundle/appimage/XHarness_${{ needs.plan.outputs.version }}_amd64.AppImage"
          python -B ../../scripts/patch-linux-appimage.py --appimage "$package"
          npm exec --yes --package @tauri-apps/cli@2.11.4 -- tauri signer sign "$package"
          test -s "$package.sig"
      - name: Verify architecture, embedded channel, updater signature and declared Mac code-signing policy
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python -B scripts/desktop-release-build.py collect --plan dist/desktop-plan/plan.json --platform '${{ matrix.platform }}' --target '${{ matrix.target }}' --public-key dist/updater.pub --output 'dist/desktop-package/${{ matrix.platform }}'
      - name: Owned Windows profile isolation regression (no installer)
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          ./scripts/test-windows-install-ownership-isolation.ps1
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -File scripts/test-windows-install-ownership-isolation.ps1
          if ($LASTEXITCODE) { throw 'Windows fixture isolation regression failed' }
      # This runs on the same worker as native updater acceptance below. It must
      # return only its own claimed KnownFolder roots to an empty namespace;
      # the later migration test still refuses all pre-existing user data.
      - name: Windows real installer ownership and crash cleanup acceptance
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: ./scripts/test-windows-install-ownership.ps1 -Installer (Resolve-Path 'dist/desktop-package/windows-x86_64/XHarness_${{ needs.plan.outputs.version }}_x64-setup.exe').Path -RuntimeAudit dist/windows-runtime-audit/collect.json
      # Diagnostic bytes only, not desktop-package / candidate / native evidence.
      # A failed run still cannot be promoted. Preserve the exact failed package
      # so investigating a lock never requires rebuilding or reusing its version.
      - name: Retain unaccepted Windows installer only when the worker fails
        if: failure() && matrix.platform == 'windows-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-unaccepted-diagnostic
          path: |
            dist/desktop-package/windows-x86_64/*.exe
            dist/desktop-package/windows-x86_64/*.sig
            dist/windows-runtime-audit/collect.json
            dist/desktop-plan/plan.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify and archive exact EXE/PDB pairs separately from installers
        if: matrix.platform == 'windows-x86_64'
        run: python -B scripts/archive-desktop-symbols.py --target '${{ matrix.target }}' --output dist/desktop-symbols-windows
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'windows-x86_64'
        with:
          name: desktop-symbols-windows-${{ needs.plan.outputs.version }}
          path: dist/desktop-symbols-windows.zip
          if-no-files-found: error
          retention-days: ${{ inputs.automatic_candidate && 14 || 90 }}
      - uses: actions/upload-artifact@v7
        if: always() && matrix.platform == 'windows-x86_64'
        with:
          name: desktop-installation-ownership-evidence
          path: dist/install-ownership-evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-package-${{ matrix.platform }}
          path: dist/desktop-package/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: ${{ inputs.automatic_candidate && 14 || 90 }}
      - name: Prepare disposable Unix BASE on this worker while other platforms are building
        if: inputs.integrated_acceptance && matrix.platform != 'windows-x86_64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B scripts/desktop-release-build.py prepare-in-build --plan dist/desktop-plan/plan.json --platform '${{ matrix.platform }}' --package 'dist/desktop-package/${{ matrix.platform }}' --output "$RUNNER_TEMP/desktop-base-context" --root "$RUNNER_TEMP/desktop-unix-update"
      - name: Build Unix BASE using the already staged Host and hot native target
        if: inputs.integrated_acceptance && matrix.platform != 'windows-x86_64'
        working-directory: ${{ runner.temp }}/desktop-unix-update/source/apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm exec --yes --package @tauri-apps/cli@2.11.4 -- tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - name: Fetch the complete immutable aggregate for Unix (never a partial manifest)
        if: inputs.integrated_acceptance && matrix.platform != 'windows-x86_64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B scripts/desktop-release-build.py fetch-in-build --plan dist/desktop-plan/plan.json --output "$RUNNER_TEMP/desktop-unix-candidate"
      - name: Three production updater rounds against the exact signed Unix target
        if: inputs.integrated_acceptance && matrix.platform != 'windows-x86_64'
        run: python -B scripts/desktop-release-build.py native-run --candidate "$RUNNER_TEMP/desktop-unix-candidate" --root "$RUNNER_TEMP/desktop-unix-update"
      - name: Export synthetic Unix native evidence only
        if: always() && inputs.integrated_acceptance && matrix.platform != 'windows-x86_64'
        run: python -B scripts/desktop-release-build.py export-native --root "$RUNNER_TEMP/desktop-unix-update" --output 'dist/native-evidence/${{ matrix.platform }}'
      - uses: actions/upload-artifact@v7
        if: always() && inputs.integrated_acceptance && matrix.platform != 'windows-x86_64'
        with:
          name: desktop-acceptance-${{ matrix.platform }}
          path: dist/native-evidence/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: ${{ inputs.automatic_candidate && 14 || 90 }}
      - name: Fetch complete immutable Windows candidate on the signing worker
        if: inputs.integrated_acceptance && matrix.platform == 'windows-x86_64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B scripts/desktop-release-build.py fetch-in-build --plan dist/desktop-plan/plan.json --output dist/unified-windows-candidate
      - name: Stage Windows one-hop upgrade from the authenticated stable installer
        if: inputs.integrated_acceptance && matrix.platform == 'windows-x86_64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          UPSTREAM_PUBLIC_KEY: ${{ secrets.XHARNESS_FRIENDS_PUBLIC_KEY }}
        run: node scripts/desktop-windows-acceptance.mjs stage
      - name: Install isolated Windows native UI driver
        if: inputs.integrated_acceptance && matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/migration-deps" --no-save --package-lock=false playwright@1.61.1
          if ($LASTEXITCODE) { throw 'Playwright installation failed' }
          "MIGRATION_TEST_DEPS=$env:RUNNER_TEMP/migration-deps/node_modules/playwright/index.mjs" >> $env:GITHUB_ENV
      - name: Exact Windows one-hop update and data preservation
        if: inputs.integrated_acceptance && matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          ./scripts/windows-migration-acceptance.ps1
          if ($LASTEXITCODE) { throw 'Native updater acceptance failed' }
      - name: Bind Windows native evidence to this immutable build attempt
        if: inputs.integrated_acceptance && matrix.platform == 'windows-x86_64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          UPSTREAM_PUBLIC_KEY: ${{ secrets.XHARNESS_FRIENDS_PUBLIC_KEY }}
        run: node scripts/desktop-windows-acceptance.mjs collect
      - uses: actions/upload-artifact@v7
        if: always() && inputs.integrated_acceptance && matrix.platform == 'windows-x86_64'
        with:
          name: desktop-acceptance-windows-x86_64
          path: dist/migration-acceptance/evidence/
          if-no-files-found: warn
          retention-days: ${{ inputs.automatic_candidate && 14 || 90 }}
      - name: Destroy isolated publisher keychain after signing and native acceptance
        if: ${{ always() && matrix.macos_selfsigned }}
        run: python -B scripts/macos-stable-signing.py cleanup
      - name: Save verified portable ripgrep cache
        if: success() && github.ref == 'refs/heads/master' && steps.portable-rg-cache.outputs.cache-hit != 'true' && startsWith(matrix.platform, 'darwin-')
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xharness-portable-rg
          key: ${{ steps.portable-rg-cache.outputs.cache-primary-key }}

  aggregate:
    # The pipeline workers wait for this artifact; depending on build would deadlock.
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 85
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked source UI toolchain
        run: npm ci --prefix ui --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: desktop-plan
          path: dist/desktop-candidate
      - name: Wait for immutable platform packages without waiting for native worker completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B scripts/desktop-release-build.py wait-packages --plan dist/desktop-candidate/plan.json --output dist/pipeline-handoff
          mv 'dist/pipeline-handoff/desktop-symbols-windows-${{ needs.plan.outputs.version }}' dist/symbols-archive
          mv dist/pipeline-handoff dist/matrix-artifacts
      - name: Install final Windows installer extractor
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Independently verify all selected immutable platform receipts and aggregate once
        env:
          XHARNESS_UPDATER_PUBKEY: ${{ secrets.XHARNESS_FRIENDS_PUBLIC_KEY }}
        run: python3 -B scripts/desktop-release-build.py aggregate --plan dist/desktop-candidate/plan.json --artifacts dist/matrix-artifacts --output dist/desktop-candidate/release
      - name: Retain verified symbols as a separate immutable release asset
        run: python3 -B scripts/attach-desktop-symbols.py --candidate dist/desktop-candidate --symbols dist/symbols-archive/desktop-symbols-windows.zip
      - name: Stage one complete draft, never latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B scripts/desktop-release-build.py stage-draft --candidate dist/desktop-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-candidate
          path: dist/desktop-candidate/
          if-no-files-found: error
          retention-days: ${{ inputs.automatic_candidate && 14 || 90 }}
      - name: Preserve public-material draft identity even when staging fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-draft-staging-evidence
          path: |
            dist/desktop-candidate/draft-creation-attempt.json
            dist/desktop-candidate/draft-created.json
            dist/desktop-candidate/draft-snapshot.json
          if-no-files-found: warn
          retention-days: ${{ inputs.automatic_candidate && 14 || 90 }}
